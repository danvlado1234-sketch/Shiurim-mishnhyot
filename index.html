<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>שיעורי משנה · מאת הרה"ג רבי יצחק ולדומירסקי שליט"א</title>
<meta name="description" content="שיעורי משנה יומיים מפי הרה&quot;ג רבי יצחק ולדומירסקי שליט&quot;א — האזנה חינם לפי סדר, מסכת, פרק ומשנה, עם קישור לטקסט המשנה.">

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Frank+Ruhl+Libre:wght@400;500;700;900&family=Heebo:wght@300;400;500;700&display=swap" rel="stylesheet">
<style>
  :root{
    --paper:#EDE3CC;
    --paper-deep:#E1D3B2;
    --ink:#241F16;
    --ink-soft:#463C2C;
    --wine:#7A2A28;
    --wine-deep:#551C1B;
    --brass:#A9812F;
    --brass-light:#C9A653;
    --ghost:#8C8370;
    --ghost-bg:#E7DCC2;
    --shadow-sm: 0 1px 3px rgba(36,31,22,0.08);
    --shadow-md: 0 6px 16px rgba(36,31,22,0.14);
    --shadow-wine: 0 8px 18px rgba(85,28,27,0.28);
  }

  * { box-sizing: border-box; }

  html, body {
    margin: 0;
    padding: 0;
    background: var(--paper);
    color: var(--ink);
    font-family: 'Heebo', sans-serif;
  }

  body {
    background-image:
      radial-gradient(ellipse 900px 500px at 50% -10%, rgba(255,255,255,0.08), transparent 60%),
      linear-gradient(180deg, rgba(18,13,9,0.55) 0%, rgba(24,17,12,0.4) 45%, rgba(237,227,204,0.95) 100%),
      url('bg-rabbi.jpg');
    background-size: auto, cover, cover;
    background-position: top, 42% 32%, 42% 32%;
    background-repeat: no-repeat, no-repeat, no-repeat;
    background-attachment: scroll, fixed, fixed;
    min-height: 100vh;
  }

  a { color: inherit; }

  .wrap {
    max-width: 980px;
    margin: 0 auto;
    padding: 0 20px 80px;
  }

  /* ---------- Header ---------- */

  header.hero {
    padding: 32px 20px 24px;
    text-align: center;
    margin-bottom: 20px;
  }

  .hero h1 {
    font-family: 'Frank Ruhl Libre', serif;
    font-weight: 900;
    font-size: clamp(32px, 6vw, 52px);
    margin: 0 0 10px;
    color: #f6ecd3;
    letter-spacing: 0.5px;
    text-shadow: 0 2px 12px rgba(20,14,8,0.45);
  }

  .hero .tagline {
    font-family: 'Frank Ruhl Libre', serif;
    font-weight: 400;
    font-style: normal;
    color: var(--brass-light);
    font-size: clamp(16px, 2.6vw, 20px);
    margin: 0 0 18px;
    text-shadow: 0 1px 8px rgba(20,14,8,0.4);
  }

  .ornament {
    display: flex;
    justify-content: center;
    color: var(--brass-light);
    opacity: .9;
    margin: 2px 0 18px;
  }

  .hero .meta {
    font-size: 14px;
    color: #ece0c4;
    font-weight: 300;
  }

  .hero .meta strong {
    color: var(--brass-light);
    font-weight: 700;
  }

  /* ---------- Shelf view ---------- */

  .seder-block {
    margin-bottom: 34px;
  }

  .seder-label {
    font-family: 'Frank Ruhl Libre', serif;
    font-weight: 700;
    font-size: 15px;
    color: var(--ink-soft);
    letter-spacing: 2px;
    margin: 0 0 10px 2px;
    display: flex;
    align-items: baseline;
    gap: 8px;
  }

  .seder-label::after {
    content: "";
    flex: 1;
    height: 1px;
    background: var(--paper-deep);
  }

  .shelf {
    display: flex;
    flex-wrap: wrap;
    gap: 10px;
  }

  .volume {
    all: unset;
    cursor: pointer;
    font-family: 'Frank Ruhl Libre', serif;
    font-size: 15px;
    font-weight: 700;
    text-align: center;
    padding: 14px 10px 12px;
    min-width: 96px;
    flex: 1 1 96px;
    max-width: 140px;
    border-radius: 3px;
    position: relative;
    transition: transform 0.18s cubic-bezier(.22,.8,.25,1), box-shadow 0.18s ease;
    animation: volumeIn .32s cubic-bezier(.22,.8,.25,1) both;
  }

  @keyframes volumeIn {
    from { opacity: 0; transform: translateY(8px); }
    to { opacity: 1; transform: translateY(0); }
  }

  @keyframes rowIn {
    from { opacity: 0; transform: translateY(6px); }
    to { opacity: 1; transform: translateY(0); }
  }

  @keyframes fadeSlideIn {
    from { opacity: 0; transform: translateY(6px); }
    to { opacity: 1; transform: translateY(0); }
  }

  #app.fade-in { animation: fadeSlideIn .28s ease both; }

  @media (prefers-reduced-motion: reduce) {
    .volume, .mishna-row, #app.fade-in, .refresh-spin { animation: none !important; transition: none !important; }
  }

  .volume:focus-visible {
    outline: 3px solid var(--brass);
    outline-offset: 2px;
  }

  .volume.has-shiur {
    background: linear-gradient(155deg, var(--wine) 0%, var(--wine-deep) 100%);
    color: var(--brass-light);
    box-shadow: 0 2px 0 var(--wine-deep), 0 6px 12px rgba(30,15,10,0.2), inset 0 1px 0 rgba(255,255,255,0.07);
    border-top: 3px double var(--brass);
    border-bottom: 3px double var(--brass);
  }

  .volume.has-shiur:hover {
    transform: translateY(-4px) scale(1.02);
    box-shadow: 0 6px 0 var(--wine-deep), var(--shadow-wine), inset 0 1px 0 rgba(255,255,255,0.1);
  }

  .volume.empty {
    background: var(--ghost-bg);
    color: var(--ink-soft);
    border: 1px solid var(--paper-deep);
    border-top: 3px double var(--paper-deep);
    border-bottom: 3px double var(--paper-deep);
  }

  .volume.empty:hover {
    background: #ded2ae;
    transform: translateY(-2px);
    box-shadow: var(--shadow-sm);
  }

  .volume .count {
    display: block;
    font-family: 'Heebo', sans-serif;
    font-weight: 400;
    font-size: 11px;
    margin-top: 4px;
    opacity: 0.85;
  }

  /* ---------- Detail view ---------- */

  .breadcrumb {
    font-size: 14px;
    margin-bottom: 20px;
    display: flex;
    align-items: center;
    flex-wrap: wrap;
    gap: 10px;
  }

  .breadcrumb button {
    all: unset;
    cursor: pointer;
    display: inline-flex;
    align-items: center;
    gap: 4px;
    color: var(--wine);
    font-weight: 700;
    background: #F6EFDD;
    border: 1px solid var(--paper-deep);
    border-radius: 20px;
    padding: 7px 14px;
    box-shadow: var(--shadow-sm);
    transition: box-shadow .15s ease, border-color .15s ease;
  }

  .breadcrumb button:hover {
    border-color: var(--wine);
    box-shadow: var(--shadow-md);
  }

  .breadcrumb button:focus-visible {
    outline: 2px solid var(--brass);
    outline-offset: 2px;
  }

  .breadcrumb .home-link {
    color: var(--ink-soft);
    font-weight: 500;
  }

  .breadcrumb .home-link:hover {
    color: var(--wine);
    border-color: var(--wine);
  }

  .breadcrumb-sep {
    color: var(--ink-soft);
    font-size: 12px;
  }

  .masechet-title {
    font-family: 'Frank Ruhl Libre', serif;
    font-size: clamp(26px, 5vw, 38px);
    font-weight: 900;
    margin: 0 0 4px;
    color: #f6ecd3;
    text-shadow: 0 2px 10px rgba(20,14,8,0.5);
  }

  .masechet-sub {
    color: #e7dcc0;
    font-size: 14px;
    margin-bottom: 30px;
    text-shadow: 0 1px 6px rgba(20,14,8,0.4);
  }

  .perek-block {
    margin-bottom: 28px;
  }

  .perek-heading {
    font-family: 'Frank Ruhl Libre', serif;
    font-weight: 700;
    font-size: 19px;
    color: var(--wine);
    margin: 0 0 12px;
    padding-bottom: 6px;
    border-bottom: 1px solid var(--paper-deep);
  }

  .mishna-row {
    background: #F6EFDD;
    border: 1px solid var(--paper-deep);
    border-right: 4px solid var(--brass);
    border-radius: 6px;
    padding: 12px 16px;
    margin-bottom: 10px;
    box-shadow: var(--shadow-sm);
    transition: box-shadow .18s ease, border-color .18s ease;
    animation: rowIn .3s ease both;
  }

  .mishna-row:hover {
    box-shadow: var(--shadow-md);
    border-right-color: var(--wine);
  }

  .mishna-row .mishna-head {
    display: flex;
    justify-content: space-between;
    align-items: baseline;
    flex-wrap: wrap;
    gap: 8px;
    margin-bottom: 8px;
  }

  .mishna-row .mishna-num {
    font-family: 'Frank Ruhl Libre', serif;
    font-weight: 700;
    font-size: 16px;
  }

  .mishna-row .mishna-date {
    font-size: 12px;
    color: var(--ghost);
    font-weight: 300;
  }

  .share-btn {
    all: unset;
    cursor: pointer;
    display: inline-flex;
    align-items: center;
    color: var(--ghost);
    padding: 4px;
    border-radius: 4px;
    transition: color .15s ease, background .15s ease;
  }

  .share-btn:hover { color: var(--wine); background: rgba(122,42,40,0.08); }
  .share-btn:focus-visible { outline: 2px solid var(--brass); outline-offset: 1px; }

  .mishna-row .text-link {
    font-size: 12px;
    color: var(--accent, #7A2A28);
    text-decoration: none;
    border: 1px solid var(--accent, #7A2A28);
    border-radius: 4px;
    padding: 2px 8px;
    font-weight: 400;
    white-space: nowrap;
    transition: background .15s, color .15s;
  }
  .mishna-row .text-link:hover {
    background: var(--accent, #7A2A28);
    color: #fff;
  }

  audio {
    width: 100%;
    height: 36px;
  }

  .empty-state {
    background: var(--ghost-bg);
    border: 1px dashed var(--ghost);
    border-radius: 4px;
    padding: 28px;
    text-align: center;
    color: var(--ink-soft);
  }

  /* ---------- Setup / errors ---------- */

  .notice {
    background: #F6EFDD;
    border: 1px solid var(--brass);
    border-radius: 4px;
    padding: 22px 24px;
    line-height: 1.8;
  }

  .notice h2 {
    font-family: 'Frank Ruhl Libre', serif;
    margin-top: 0;
  }

  .notice code {
    background: var(--paper-deep);
    padding: 2px 6px;
    border-radius: 3px;
    font-size: 13px;
  }

  .unmatched {
    margin-top: 40px;
    font-size: 13px;
    color: var(--ghost);
  }

  .unmatched summary {
    cursor: pointer;
    font-weight: 700;
  }

  .refresh-row {
    text-align: left;
    margin-bottom: 20px;
  }

  .refresh-btn {
    all: unset;
    cursor: pointer;
    display: inline-flex;
    align-items: center;
    gap: 8px;
    font-size: 13px;
    color: var(--wine);
    background: #F6EFDD;
    border: 1px solid var(--wine);
    padding: 6px 14px;
    border-radius: 20px;
    box-shadow: var(--shadow-sm);
    transition: background .15s ease, color .15s ease, box-shadow .15s ease;
  }

  .refresh-btn:hover { background: var(--wine); color: var(--paper); box-shadow: var(--shadow-sm); }
  .refresh-btn:focus-visible { outline: 2px solid var(--brass); outline-offset: 2px; }
  .refresh-btn.is-loading { cursor: default; opacity: .85; }

  .refresh-spin {
    width: 12px;
    height: 12px;
    border: 2px solid currentColor;
    border-top-color: transparent;
    border-radius: 50%;
    display: none;
    flex-shrink: 0;
  }

  .refresh-btn.is-loading .refresh-spin {
    display: inline-block;
    animation: spin .7s linear infinite;
  }

  @keyframes spin { to { transform: rotate(360deg); } }

  .toast {
    position: fixed;
    bottom: 26px;
    left: 50%;
    transform: translateX(-50%) translateY(16px);
    background: var(--ink);
    color: var(--paper);
    padding: 11px 22px;
    border-radius: 22px;
    font-size: 14px;
    font-weight: 500;
    opacity: 0;
    pointer-events: none;
    transition: opacity .25s ease, transform .25s ease;
    box-shadow: 0 10px 24px rgba(0,0,0,0.28);
    z-index: 50;
    max-width: calc(100vw - 40px);
    text-align: center;
  }

  .toast.show {
    opacity: 1;
    transform: translateX(-50%) translateY(0);
  }

  .search-row {
    margin-bottom: 24px;
    display: flex;
    gap: 10px;
  }

  .search-field {
    position: relative;
    flex: 1;
    min-width: 0;
  }

  .search-icon {
    position: absolute;
    top: 50%;
    right: 16px;
    transform: translateY(-50%);
    color: var(--ghost);
    pointer-events: none;
  }

  .search-input {
    width: 100%;
    box-sizing: border-box;
    font-family: 'Heebo', sans-serif;
    font-size: 16px;
    padding: 12px 44px 12px 16px;
    border: 1px solid var(--paper-deep);
    border-radius: 20px;
    background: #F6EFDD;
    color: var(--ink);
    transition: box-shadow .15s ease, border-color .15s ease;
  }

  .search-input:focus-visible {
    border-color: var(--brass);
  }

  .search-input::placeholder { color: var(--ghost); }

  .search-input:focus-visible {
    outline: 2px solid var(--brass);
    outline-offset: 1px;
  }

  .search-btn {
    font-family: 'Heebo', sans-serif;
    font-size: 15px;
    padding: 12px 22px;
    border: 1px solid var(--wine);
    border-radius: 20px;
    background: var(--wine);
    color: var(--paper);
    cursor: pointer;
    flex-shrink: 0;
  }

  .search-btn:hover { opacity: .9; }
  .search-btn:focus-visible { outline: 2px solid var(--brass); outline-offset: 2px; }

  .no-results {
    text-align: center;
    color: var(--ghost);
    padding: 30px 10px;
    font-size: 14px;
  }

  .perek-block.highlight .perek-heading {
    color: var(--wine);
  }

  .volume.highlight {
    box-shadow: 0 0 0 3px var(--brass);
  }

  .mishna-row.highlight {
    border-color: var(--brass);
    box-shadow: 0 0 0 2px var(--brass);
    background: #FBF6E9;
  }

  footer {
    text-align: center;
    font-size: 12px;
    color: var(--ghost);
    padding: 30px 20px;
  }
</style>
</head>

  // בונה קישור לספריא לטקסט המשנה. מחזיר null אם המסכת לא במיפוי.

  // בונה קישור ישיר למשנה מסוימת - חוזר על אותה שאילתה שהיה אפשר להקליד בחיפוש

  let index = {};      // { masechet: { perek: [ {mishna, date, url, filename} ] } }
  let unmatched = [];
  let view = { type: 'shelf' };
  let searchQuery = '';

  function normalize(s){
    return (s||'').replace(/[\u0591-\u05C7]/g,'').replace(/\s+/g,'').trim();
  }

  // ממיר מספר לאותיות גימטריה (1 -> א, 15 -> טו, 21 -> כא)
  function toHebrewNumeral(num){
    if (!num || num < 1) return String(num);
    const ones = ['','א','ב','ג','ד','ה','ו','ז','ח','ט'];
    const tens = ['','י','כ','ל','מ','נ','ס','ע','פ','צ'];
    const hundreds = ['','ק','ר','ש','ת'];
    let n = num, out = '';
    out += hundreds[Math.floor(n/100)] || '';
    n = n % 100;
    // טיפול מיוחד ב-15 (טו) ו-16 (טז) כדי לא לכתוב שם השם
    if (n === 15) { out += 'טו'; n = 0; }
    else if (n === 16) { out += 'טז'; n = 0; }
    else {
      out += tens[Math.floor(n/10)] || '';
      n = n % 10;
      out += ones[n] || '';
    }
    return out;
  }

  // ממיר אות גימטריה או מספר-כתוב-במילים למספר. מחזיר null אם לא מספר.
  const HEB_VALUES = {'א':1,'ב':2,'ג':3,'ד':4,'ה':5,'ו':6,'ז':7,'ח':8,'ט':9,
                      'י':10,'כ':20,'ל':30,'מ':40,'נ':50,'ס':60,'ע':70,'פ':80,'צ':90,
                      'ק':100,'ר':200,'ש':300,'ת':400,'ך':20,'ם':40,'ן':50,'ף':80,'ץ':90};
  function parseHebrewNumber(token){
    if (!token) return null;
    if (/^\d+$/.test(token)) return parseInt(token, 10); // מספר רגיל
    // אות/אותיות גימטריה
    if (/^[א-ת]+$/.test(token)){
      let sum = 0;
      for (const ch of token){
        if (!(ch in HEB_VALUES)) return null;
        sum += HEB_VALUES[ch];
      }
      return sum > 0 ? sum : null;
    }
    return null;
  }

  function findCanonical(name){
    const n = normalize(name);
    for (const seder of SEDARIM){
      for (const m of seder.masechtot){
        if (normalize(m) === n) return m;
      }
    }
    return null;
  }

  // מנתח שאילתת חיפוש: "ברכות פרק א משנה ב" / "ברכות א ב" / "ברכות 1 2" / "ברכות"
  // מחזיר { masechet, perek, mishna } - כל שדה שלא זוהה יהיה null
  function parseSearchQuery(raw){
    const result = { masechet: null, perek: null, mishna: null, masechetPartial: '' };
    if (!raw) return result;
    // מסירים את מילות המפתch "פרק" ו"משנה" ומפרקים למילים
    let tokens = raw.replace(/[\u0591-\u05C7]/g,'').split(/\s+/).filter(Boolean);
    const numbers = [];
    const words = [];
    for (const t of tokens){
      if (t === 'פרק' || t === 'משנה' || t === "פ'" || t === "מ'") continue; // מילות עזר
      const num = parseHebrewNumber(t);
      // מילה שהיא כולה מספר/אות בודדת -> מספר. אחרת -> חלק משם המסכת
      if (num !== null && (/^\d+$/.test(t) || t.length <= 2) && words.length > 0){
        numbers.push(num);
      } else {
        words.push(t);
      }
    }
    const masechetText = words.join(' ');
    result.masechetPartial = masechetText;
    result.masechet = findCanonical(masechetText);
    if (numbers.length >= 1) result.perek = numbers[0];
    if (numbers.length >= 2) result.mishna = numbers[1];
    return result;
  }

  // מפענח ערך משנה שעשוי להיות בודד ('ג') או מאוחד ('ג,ד' / 'ג-ד' / 'ג_ד').
  // מחזיר { num, extra, label } - num למיון, label לתצוגה. null אם לא זוהה.
  function parseMishnaValue(parts, startIdx){
    // אוסף את כל האסימונים מ-startIdx והלאה, מנקה פסיקים/מקפים, ומפרק לאותיות
    const raw = parts.slice(startIdx).join('_');
    const pieces = raw.split(/[,\-_]+/).map(s => s.trim()).filter(Boolean);
    if (!pieces.length) return null;
    const nums = [];
    for (const p of pieces){
      const n = parseHebrewNumber(p);
      if (n === null) return null;   // אם משהו לא מספר - נכשל
      nums.push(n);
    }
    const label = nums.map(toHebrewNumeral).join('-');  // 'ג-ד'
    return { num: nums[0], extra: nums.slice(1), label };
  }

  // מפענח שם קובץ בשני פורמטים:
  //   פורמט א' (של אבא): מסכת_פרק_א_משנה_יא.m4a  (אותיות גימטריה; תומך גם במשנה מאוחדת: משנה_ג,_ד)
  //   פורמט ב' (ישן):    מסכת_1_11_תאריך.mp3     (מספרים, עם או בלי תאריך)
  function parseFilename(filename){
    const nameOnly = filename.split('/').pop();  // תמיכה בקבצים בתוך תיקיות ב-R2
    const base = nameOnly
      .replace(/\.(mp3|m4a)$/i, '')
      .replace(/^_+|_+$/g, '');            // מתעלמים מקווים תחתונים בתחילת/סוף השם
    const parts = base.split('_').filter(Boolean); // מתעלמים מקווים כפולים

    // --- פורמט א': מכיל את המילים "פרק" ו"משנה" ---
    const iPerek = parts.indexOf('פרק');
    const iMishna = parts.indexOf('משנה');
    if (iPerek > 0 && iMishna > iPerek && parts[iPerek + 1] && parts[iMishna + 1]){
      const masechet = findCanonical(parts.slice(0, iPerek).join(' '));
      const perek = parseHebrewNumber(parts[iPerek + 1]);
      const mv = parseMishnaValue(parts, iMishna + 1);   // תומך גם במשנה מאוחדת
      if (masechet && perek && mv){
        return { masechet, perek, mishna: mv.num, mishnaLabel: mv.label, date: '', source: 'r2' };
      }
      return null;
    }

    // --- פורמט ב': מסכת ואחריה שני מספרים (ואולי תאריך) ---
    const iNum = parts.findIndex(p => /^\d+$/.test(p));
    if (iNum > 0 && iNum + 1 < parts.length && /^\d+$/.test(parts[iNum + 1])){
      const masechet = findCanonical(parts.slice(0, iNum).join(' '));
      const perek = parseInt(parts[iNum], 10);
      const mishna = parseInt(parts[iNum + 1], 10);
      const date = parts.slice(iNum + 2).join('_');
      if (masechet && !isNaN(perek) && !isNaN(mishna)){
        // קבצים ישנים עם תאריך יושבים ב-GitHub; קבצים בלי תאריך - ב-R2
        return { masechet, perek, mishna, mishnaLabel: toHebrewNumeral(mishna), date, source: date ? 'github' : 'r2' };
      }
    }
    return null;
  }

  function formatDate(d){
    const parts = (d||'').split('-');
    if (parts.length !== 3) return d || '';
    const [y,m,day] = parts;
    return `${day}.${m}.${y}`;
  }

  async function fetchFileList(){
    // קריאת רשימת השיעורים מקובץ list.json שנבנה אוטומטית ע"י GitHub Action.
    // הקובץ מוגש מאותו דומיין של האתר (GitHub Pages) - בלי הגבלות קצב ובלי תלות בשרתים חיצוניים.
    const controller = new AbortController();
    const timeout = setTimeout(() => controller.abort(), 8000); // מבטל אחרי 8 שניות אם תקוע
    try {
      const res = await fetch(`list.json?_=${Date.now()}`, { cache: 'no-store', signal: controller.signal });
      clearTimeout(timeout);
      if (!res.ok) throw new Error('list-not-found');
      const names = await res.json();
      if (!Array.isArray(names)) return [];
      return names
        .filter(n => /\.(mp3|m4a)$/i.test(n))
        .map(n => ({ name: n }));
    } finally {
      clearTimeout(timeout);
    }
  }

  function fileUrl(file, parsed){
    // קבצים חדשים (הפורמט של אבא / בלי תאריך) מנוגנים מ-R2.
    // 8 השיעורים הישנים (עם תאריך בשם) נשארים ב-GitHub עד שיועברו.
    if (parsed.source === 'github'){
      return `${CONFIG.folder}/${encodeURIComponent(file.name)}`;
    }
    // קידוד כל חלק בנפרד כדי לשמר לוכסנים של תיקיות (כלאים/קובץ.m4a)
    const encoded = file.name.split('/').map(encodeURIComponent).join('/');
    return `${CONFIG.audioBase}/${encoded}`;
  }

  function buildIndex(files){
    index = {};
    unmatched = [];
    for (const f of files){
      const parsed = parseFilename(f.name);
      if (!parsed){
        unmatched.push(f.name);
        continue;
      }
      if (!index[parsed.masechet]) index[parsed.masechet] = {};
      if (!index[parsed.masechet][parsed.perek]) index[parsed.masechet][parsed.perek] = [];
      index[parsed.masechet][parsed.perek].push({
        mishna: parsed.mishna,
        mishnaLabel: parsed.mishnaLabel,
        date: parsed.date,
        url: fileUrl(f, parsed),
        filename: f.name
      });
    }
    // מיון
    for (const masechet in index){
      for (const perek in index[masechet]){
        index[masechet][perek].sort((a,b) => a.mishna - b.mishna);
      }
    }
  }

  function totalCount(){
    let n = 0;
    for (const masechet in index){
      for (const perek in index[masechet]){
        n += index[masechet][perek].length;
      }
    }
    return n;
  }

  function render(){
    if (view.type === 'setup') renderSetup();
    else if (view.type === 'error') renderError();
    else if (view.type === 'seder') renderSeder(view.name);
    else if (view.type === 'masechet') renderMasechet(view.name);
    else if (view.type === 'perek') renderPerek(view.name, view.perek);
    else if (view.type === 'results') renderResults();
    else renderShelf();

    // אנימציית כניסה: הדף כולו נכנס בעדינות, והכרטיסים בתוכו נכנסים במפל קל
    app.classList.remove('fade-in');
    void app.offsetWidth; // מאלץ רינדור מחדש כדי שהאנימציה תרוץ שוב בכל render
    app.classList.add('fade-in');
    app.querySelectorAll('.shelf .volume').forEach((el, i) => {
      el.style.animationDelay = Math.min(i * 25, 400) + 'ms';
    });
    app.querySelectorAll('.mishna-row').forEach((el, i) => {
      el.style.animationDelay = Math.min(i * 40, 400) + 'ms';
    });
  }

  // כמה שיעורים במסכת
  function countMasechet(m){
    const perakim = index[m];
    if (!perakim) return 0;
    let n = 0;
    for (const p in perakim) n += perakim[p].length;
    return n;
  }

  // כמה שיעורים בסדר שלם
  function countSeder(seder){
    let n = 0;
    for (const m of seder.masechtot) n += countMasechet(m);
    return n;
  }

  // כפתור "לדף הבית" בפירורי הלחם - מחזיר לארון הספרים מכל עומק ניווט בקליק אחד

  // חלון ראשון: ששת הסדרים
  function renderShelf(){
    headerMeta.innerHTML = `<strong>${totalCount()}</strong> שיעורים מוקלטים בארכיון`;
    let html = '<div class="shelf">';
    for (const seder of SEDARIM){

      html += `<button class="volume ${count ? 'has-shiur' : 'empty'}" data-seder="${seder.name}">

      </button>`;
    }
    html += '</div>';
    if (unmatched.length){
      html += `<details class="unmatched"><summary>קבצים שלא זוהו (${unmatched.length})</summary><ul>`;
      for (const u of unmatched) html += `<li>${u}</li>`;
      html += `</ul><p>בדקו ששם הקובץ בנוי כך: מסכת_פרק_א_משנה_ב.m4a (שם המסכת חייב להתאים לשמות שבארון)</p></details>`;

  // חלון שני: המסכתות שבסדר
  function renderSeder(name){
    headerMeta.innerHTML = `<strong>${totalCount()}</strong> שיעורים מוקלטים בארכיון`;
    const seder = SEDARIM.find(s => s.name === name);
    let html = `<div class="breadcrumb">${BREADCRUMB_HOME}<button id="backBtn">→ חזרה לסדרים</button></div>
      <h2 class="masechet-title">סדר ${name}</h2>
      <p class="masechet-sub">בחרו מסכת</p><div class="shelf">`;
    for (const m of seder.masechtot){
      const count = countMasechet(m);
      html += `<button class="volume ${count ? 'has-shiur' : 'empty'}" data-masechet="${m}">
        ${m}<span class="count">${count ? count + ' שיעורים' : 'טרם הוקלט'}</span>
      </button>`;
    }
    html += '</div>';
    app.innerHTML = html;
    bindHomeBtn();
    document.getElementById('backBtn').addEventListener('click', () => {
      view = { type: 'shelf' };
      render();
    });
    app.querySelectorAll('.volume').forEach(btn => {
      btn.addEventListener('click', () => {

  // חלון שלישי: רשימת הפרקים של המסכת
  function renderMasechet(name){
    headerMeta.innerHTML = `<strong>${totalCount()}</strong> שיעורים מוקלטים בארכיון`;
    const seder = SEDARIM.find(s => s.masechtot.includes(name));
    let html = `<div class="breadcrumb">${BREADCRUMB_HOME}<button id="backBtn">→ חזרה לסדר ${seder ? seder.name : ''}</button></div>
      <h2 class="masechet-title">מסכת ${name}</h2>
      <p class="masechet-sub">סדר ${seder ? seder.name : ''}</p>`;

    const perakim = index[name] || {};
    // מציגים את כל פרקי המסכת - גם אלה שטרם הוקלטו
    const total = PEREK_COUNTS[name] || 0;
    const nums = [];
    for (let i = 1; i <= total; i++) nums.push(i);
    for (const p of Object.keys(perakim).map(Number)){   // ליתר ביטחון: פרק שקיים בקבצים ולא בטבלה
      if (!nums.includes(p)) nums.push(p);
    }
    nums.sort((a,b) => a-b);
    if (!nums.length){
      html += `<div class="empty-state">עדיין לא הוקלטו שיעורים במסכת זו — יום אחד בבוא הזמן ⁠תמצא אותם כאן.</div>`;
    } else {
      html += '<div class="shelf">';
      const targetPerek = view.perek || null;
      for (const p of nums){
        const n = perakim[p] ? perakim[p].length : 0;
        const hi = targetPerek === p ? ' highlight' : '';
        const anchor = targetPerek === p ? ' id="target-perek"' : '';
        html += `<button class="volume ${n ? 'has-shiur' : 'empty'}${hi}" data-perek="${p}"${anchor}>
          פרק ${toHebrewNumeral(p)}<span class="count">${n ? n + ' משניות' : 'טרם הוקלט'}</span>
        </button>`;
      }
      html += '</div>';
    }
    app.innerHTML = html;
    bindHomeBtn();
    document.getElementById('backBtn').addEventListener('click', () => {
      view = seder ? { type: 'seder', name: seder.name } : { type: 'shelf' };
      render();
    });
    app.querySelectorAll('.volume').forEach(btn => {
      btn.addEventListener('click', () => {
        view = { type: 'perek', name: name, perek: Number(btn.dataset.perek) };
        render();
        window.scrollTo({ top: 0, behavior: 'smooth' });
      });
    });
    // גלילה אל הפרק שנמצא בחיפוש
    const targetEl = document.getElementById('target-perek');
    if (targetEl){
      setTimeout(() => targetEl.scrollIntoView({ behavior: 'smooth', block: 'center' }), 100);
    }
  }

  // חלון רביעי: המשניות של הפרק, עם הנגנים
  function renderPerek(name, perek){
    headerMeta.innerHTML = `<strong>${totalCount()}</strong> שיעורים מוקלטים בארכיון`;
    const targetMishna = view.mishna || null;
    const rows = (index[name] && index[name][perek]) ? index[name][perek] : [];
    let html = `<div class="breadcrumb">${BREADCRUMB_HOME}<button id="backBtn">→ חזרה למסכת ${name}</button></div>
      <h2 class="masechet-title">מסכת ${name} · פרק ${toHebrewNumeral(perek)}</h2>
      <p class="masechet-sub">${rows.length} שיעורים בפרק</p>`;
    if (!rows.length){
      html += `<div class="empty-state">עדיין לא הוקלטו שיעורים בפרק זה.</div>`;
    }
    for (const shiur of rows){
      const hi = targetMishna === shiur.mishna ? ' highlight' : '';
      const anchor = targetMishna === shiur.mishna ? ' id="target-mishna"' : '';
      const sLink = sefariaLink(name, perek, shiur.mishna);
      const shareUrl = directLink(name, perek, shiur.mishna);
      html += `<div class="mishna-row${hi}"${anchor}>
        <div class="mishna-head">
          <span class="mishna-num">משנה ${shiur.mishnaLabel || toHebrewNumeral(shiur.mishna)}</span>
          <button class="share-btn" data-link="${escAttr(shareUrl)}" title="העתק קישור למשנה זו" aria-label="העתק קישור למשנה זו">${ICON_LINK}</button>
          ${sLink ? `<a class="text-link" href="${sLink}" target="_blank" rel="noopener">${ICON_BOOK} עיין בטקסט</a>` : ''}
          ${shiur.date ? `<span class="mishna-date">הוקלט ב-${formatDate(shiur.date)}</span>` : ''}
        </div>
        <audio controls preload="none"><source src="${shiur.url}" type="${/\.m4a$/i.test(shiur.filename) ? 'audio/mp4' : 'audio/mpeg'}"></audio>
      </div>`;
    }
    app.innerHTML = html;
    bindHomeBtn();
    document.getElementById('backBtn').addEventListener('click', () => {
      view = { type: 'masechet', name: name };
      render();
    });
    const target = document.getElementById('target-mishna');
    if (target){
      setTimeout(() => target.scrollIntoView({ behavior: 'smooth', block: 'center' }), 100);
    }
  }

  // דף תוצאות חיפוש עצמאי - מציג רק את המשניות שנמצאו, עם נגנים
  function renderResults(){
    headerMeta.innerHTML = `<strong>${totalCount()}</strong> שיעורים מוקלטים בארכיון`;
    const parsed = parseSearchQuery(searchQuery);
    let html = `<div class="breadcrumb"><button id="backBtn">→ חזרה לארון הספרים</button></div>
      <h2 class="masechet-title">תוצאות חיפוש</h2>
      <p class="masechet-sub">"${searchQuery}"</p>`;

    // מזהים מסכת: שם מלא, או שם חלקי שמתאים בדיוק למסכת אחת שיש בה שיעורים
    let masechet = (parsed.masechet && index[parsed.masechet]) ? parsed.masechet : null;
    let candidates = [];
    if (!masechet && parsed.masechetPartial){
      const q = normalize(parsed.masechetPartial);
      candidates = Object.keys(index).filter(m => normalize(m).includes(q));
      if (candidates.length === 1) masechet = candidates[0];
    }

    if (masechet){
      const perakim = index[masechet];
      const perekNums = Object.keys(perakim).map(Number).sort((a,b) => a-b)
        .filter(p => !parsed.perek || p === parsed.perek);
      let found = 0;
      for (const p of perekNums){
        const rows = perakim[p].filter(s => !parsed.mishna || s.mishna === parsed.mishna);
        if (!rows.length) continue;
        html += `<div class="perek-block"><h3 class="perek-heading">מסכת ${masechet} · פרק ${toHebrewNumeral(p)}</h3>`;
        for (const shiur of rows){
          found++;
          const sLink = sefariaLink(masechet, p, shiur.mishna);
          const shareUrl = directLink(masechet, p, shiur.mishna);
          html += `<div class="mishna-row">
            <div class="mishna-head">
              <span class="mishna-num">משנה ${shiur.mishnaLabel || toHebrewNumeral(shiur.mishna)}</span>
              <button class="share-btn" data-link="${escAttr(shareUrl)}" title="העתק קישור למשנה זו" aria-label="העתק קישור למשנה זו">${ICON_LINK}</button>
              ${sLink ? `<a class="text-link" href="${sLink}" target="_blank" rel="noopener">${ICON_BOOK} עיין בטקסט</a>` : ''}
              ${shiur.date ? `<span class="mishna-date">הוקלט ב-${formatDate(shiur.date)}</span>` : ''}
            </div>
            <audio controls preload="none"><source src="${shiur.url}" type="${/\.m4a$/i.test(shiur.filename) ? 'audio/mp4' : 'audio/mpeg'}"></audio>
          </div>`;
        }
        html += `</div>`;
      }
      if (!found){
        html += `<div class="no-results">נמצאה מסכת ${masechet}, אבל אין שיעור שמתאים לפרק או למשנה שביקשת</div>`;
      }
    } else if (candidates.length > 1){
      html += `<p class="masechet-sub">נמצאו כמה מסכתות מתאימות — בחר אחת:</p><div class="shelf">`;
      for (const m of candidates){
        let count = 0;
        for (const p in index[m]) count += index[m][p].length;
        html += `<button class="volume has-shiur" data-masechet="${m}">${m}<span class="count">${count} שיעורים</span></button>`;
      }
      html += `</div>`;
    } else {
      html += `<div class="no-results">לא נמצאו שיעורים עבור "${searchQuery}"</div>`;
    }

    app.innerHTML = html;
    document.getElementById('backBtn').addEventListener('click', () => {
      view = { type: 'shelf' };
      render();
    });
    app.querySelectorAll('.volume').forEach(btn => {
      btn.addEventListener('click', () => {
        view = { type: 'masechet', name: btn.dataset.masechet };
        render();
        window.scrollTo({ top: 0, behavior: 'smooth' });
      });
    });
  }

  function renderSetup(){
    headerMeta.textContent = '';
    app.innerHTML = `<div class="notice">
      <h2>שלב הקמה אחרון</h2>
      <p>האתר מוכן, אבל עדיין לא מחובר למאגר שבו יישמרו קבצי ההקלטה.</p>
      <p>פתחו את קובץ <code>index.html</code>, חפשו את החלק שנקרא <code>CONFIG</code> בתחילת הקוד, והזינו שם את:</p>
      <p><code>owner</code> — שם המשתמש שלכם ב-GitHub<br><code>repo</code> — שם המאגר (repository) שיצרתם</p>
      <p>לאחר מכן שמרו והעלו מחדש. זו פעולה חד-פעמית בלבד.</p>
    </div>`;
  }

  function renderError(){
    headerMeta.textContent = '';
    app.innerHTML = `<div class="notice">
      <h2>רשימת השיעורים עדיין לא נבנתה</h2>
      <p>אם זו הפעם הראשונה: ודאו שקובץ ה-Action הועלה (ראו הוראות) ושהועלה לפחות שיעור אחד לתיקיית shiurim. הרשימה נבנית אוטומטית תוך כדקה מהעלאת שיעור.</p>
      <button class="refresh-btn" id="retryBtn">נסה שוב</button>
    </div>`;
    document.getElementById('retryBtn').addEventListener('click', () => load());
  }

  const CACHE_KEY = 'shiurim-cache-v1';

  function saveCache(files){
    try {
      localStorage.setItem(CACHE_KEY, JSON.stringify({ files, savedAt: Date.now() }));
    } catch (e){ /* לא קריטי אם זה נכשל */ }
  }

  function loadCache(){
    try {
      const raw = localStorage.getItem(CACHE_KEY);
      return raw ? JSON.parse(raw).files : null;
    } catch (e){
      return null;
    }
  }

  // מחזיר true/false לפי הצלחה, כדי שקוד קורא (כמו כפתור הרענון) יוכל
  // לדווח למשתמש בפועל מה קרה, ולא רק לרנדר בשקט.
  async function load(retryCount){
    retryCount = (typeof retryCount === 'number') ? retryCount : 0;
    try {
      const files = await fetchFileList();
      buildIndex(files);
      saveCache(files);
      view = (view.type === 'masechet' || view.type === 'seder' || view.type === 'perek') ? view : { type: 'shelf' };
      render();
      return true;
    } catch (e){
      // ניסיון חוזר אוטומטי פעם אחת אחרי כשל זמני (למשל הגבלת קצב של GitHub)
      if (retryCount < 1){
        await new Promise(r => setTimeout(r, 3000));
        return load(retryCount + 1);
      }
      // אם יש נתונים שמורים מקודם - נציג אותם במקום מסך שגיאה
      const cached = loadCache();
      if (cached){
        buildIndex(cached);
        view = (view.type === 'masechet' || view.type === 'seder' || view.type === 'perek') ? view : { type: 'shelf' };
        render();
        return false;
      }
      view = { type: 'error' };
      render();
      return false;
    }
  }

  let toastTimer;
  function showToast(msg){
    const t = document.getElementById('toast');
    t.textContent = msg;
    t.classList.add('show');
    clearTimeout(toastTimer);
    toastTimer = setTimeout(() => t.classList.remove('show'), 3000);
  }

  const refreshLabel = document.getElementById('refreshLabel');

  refreshBtn.addEventListener('click', async () => {
    if (refreshBtn.classList.contains('is-loading')) return;
    refreshBtn.classList.add('is-loading');
    refreshLabel.textContent = 'בודק…';
    const before = totalCount();
    const ok = await load();
    refreshBtn.classList.remove('is-loading');
    refreshLabel.textContent = 'בדוק שיעורים חדשים';
    if (!ok){
      showToast('לא הצלחנו להתחבר לשרת — נסו שוב בעוד רגע');
      return;
    }
    const added = totalCount() - before;
    showToast(added > 0 ? `נמצאו ${added} שיעורים חדשים` : 'הרשימה מעודכנת — אין חדש');
  });

  function runSearch(){
    searchQuery = searchInput.value.trim();
    if (!searchQuery){
      view = { type: 'shelf' };
      render();
      return;
    }
    // אם החיפוש מזהה מסכת אחת ברורה - נכנסים ישר לחלון שלה
    const parsed = parseSearchQuery(searchQuery);
    let masechet = (parsed.masechet && index[parsed.masechet]) ? parsed.masechet : null;
    if (!masechet && parsed.masechetPartial){
      const q = normalize(parsed.masechetPartial);
      const cands = Object.keys(index).filter(m => normalize(m).includes(q));
      if (cands.length === 1) masechet = cands[0];
    }
    if (masechet){
      const perakim = index[masechet] || {};
      const rows = parsed.perek ? perakim[parsed.perek] : null;
      if (parsed.perek && parsed.mishna && rows && rows.some(r => r.mishna === parsed.mishna)){
        // בוקשה משנה מסוימת שקיימת - נכנסים לחלון הפרק ומדגישים אותה
        view = { type: 'perek', name: masechet, perek: parsed.perek, mishna: parsed.mishna };
      } else if (parsed.perek){
        // בוקש פרק - חלון המסכת עם הפרק מודגש (גם אם טרם הוקלט)
        view = { type: 'masechet', name: masechet, perek: parsed.perek };
      } else {
        // רק שם מסכת - חלון המסכת עם רשימת הפרקים
        view = { type: 'masechet', name: masechet };
      }
      render();
      window.scrollTo({ top: 0, behavior: 'smooth' });
      return;
    }
    // לא זוהתה מסכת אחת ברורה - דף תוצאות רגיל
    view = { type: 'results' };
    render();
    window.scrollTo({ top: 0, behavior: 'smooth' });
  }


  searchBtn.addEventListener('click', runSearch);
  searchInput.addEventListener('keydown', (e) => {
    if (e.key === 'Enter'){
      e.preventDefault();
      runSearch();
    }
  });

  load().then(() => {
    // קישור ישיר למשנה מסוימת: ?q=ברכות+פרק+א+משנה+ב, אותה שאילתה כמו בחיפוש הרגיל
    const q = new URLSearchParams(location.search).get('q');
    if (q){
      searchInput.value = q;
      runSearch();
    }
  });
})();
</script>
  <script>
document.addEventListener('play', function(e){
  if (e.target.tagName === 'AUDIO'){
    document.querySelectorAll('audio').forEach(function(a){
      if (a !== e.target) a.pause();
    });
  }
}, true);
  </script>
