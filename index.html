<!-- אפליקציה: האפליקציה המאוחדת "שיעורי הרב" - ה-manifest וה-service worker יושבים בדף השער
     (scope "/"), כך שהתקנה מכאן מתקינה אפליקציה אחת לכל השיעורים -->
<link rel="manifest" href="/manifest.webmanifest">
<link rel="icon" type="image/png" sizes="192x192" href="/icons/mishna-192.png">
<link rel="apple-touch-icon" href="/icons/apple-touch-icon.png">

<script>
  // מצב יום / לילה: קודם מה שהמשתמש בחר בכפתור ☀/☾ (נשמר במכשיר); בלי בחירה -
  // כהה כשפתוח כאפליקציה מותקנת, בהיר באתר בדפדפן. רץ לפני שהדף מצויר.
  (function(){
    var pref = null;
    try { pref = localStorage.getItem('mishna:theme'); } catch (e) {}
    var app = (window.matchMedia && matchMedia('(display-mode: standalone)').matches) || navigator.standalone === true;
    var theme = (pref === 'light' || pref === 'dark') ? pref : (app ? 'dark' : 'light');
    document.documentElement.setAttribute('data-theme', theme);
    var m = document.querySelector('meta[name="theme-color"]');
    if (m) m.setAttribute('content', theme === 'light' ? '#f6efe4' : '#170f10');
  })();
</script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Frank+Ruhl+Libre:wght@400;500;700;900&family=Heebo:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
  /* ====== שפת העיצוב המשותפת לאתרי השיעורים (כמו אתר הפרשות), בצבע היין
     של המשניות. שתי ערכות צבעים: כהה ובהירה (data-theme על html). הנגנים
     והכרטיס "הלימוד היומי" תמיד כהים. ====== */
  :root, .sheet, .mini, .daily {
    --bg:#170f10; --surface:#221516; --surface2:#2e1e1f; --line:#3a2728;
    --text:#f3e7d6; --text2:#e0cfc0; --muted:#b59d95; --muted2:#8f7870;
    --gold:#e3c27a; --gold-ink:#2a1210; --done:#7fcf9f;
    --hl:#e3c27a; --save:#e3c27a;
    --btn:#e3c27a; --btn-ink:#2a1210;
    --badge:#e3c27a; --badge-ink:#2a1210;
    --hover:rgba(255,255,255,.05); --glass:rgba(0,0,0,.25);
    --track:rgba(255,255,255,.12); --prog:#e3c27a;
    --menu:#33211f; --field:#f3e7d6; --field-ink:#170f10;
    --tabs-bg:linear-gradient(180deg, rgba(23,15,16,.6), rgba(23,15,16,.97) 40%); --tabs-line:transparent;
    --tabs-desk:rgba(23,15,16,.93);
    color-scheme:dark;
  }
  html[data-theme="light"] {
    --bg:#f6efe4; --surface:#fffaf3; --surface2:#efe3d3; --line:#e6d6c3;
    --text:#2a1d1b; --text2:#4a3530; --muted:#8c776e; --muted2:#a8958c;
    --done:#2e7d4f;
    --hl:#7a2a28; --save:#b07a22;
    --btn:#7a2a28; --btn-ink:#fff;
    --badge:#7a2a28; --badge-ink:#fff;
    --hover:rgba(42,29,27,.05); --glass:rgba(42,29,27,.07);
    --track:#eadfcf; --prog:#7a2a28;
    --menu:#fffaf3; --field:#fff; --field-ink:#2a1d1b;
    --tabs-bg:rgba(246,239,228,.96); --tabs-line:#e6d6c3;
    --tabs-desk:rgba(246,239,228,.95);
    color-scheme:light;
  }
  :root {
    --ca:#8a7a2e; --cb:#4f4415;   /* צבעי הסדר הנוכחי (משתנים לפי הדף/השיעור) */
    --tabs-h: 66px; --mini-h: 0px;
    --safe-b: env(safe-area-inset-bottom, 0px); --safe-t: env(safe-area-inset-top, 0px);
  }
  * { margin:0; padding:0; box-sizing:border-box; }
  [hidden] { display:none !important; }
  /* בלי הגדלה (צביטה / הקשה כפולה) - התנהגות של אפליקציה */
  html { background:var(--bg); touch-action:pan-x pan-y; -webkit-text-size-adjust:100%; text-size-adjust:100%; }
  body { font-family:'Heebo',sans-serif; background:var(--bg); color:var(--text); min-height:100vh; -webkit-tap-highlight-color:transparent;
    padding-bottom:calc(var(--tabs-h) + var(--mini-h) + var(--safe-b) + 24px); }
  body.has-player { --mini-h: 66px; }
  button { font-family:inherit; color:inherit; }
  a { color:inherit; }
  .wrap { max-width:760px; margin:0 auto; position:relative; }
  #app { padding-top:var(--safe-t); position:relative; }
  #app.fade-in { animation: fadeIn .22s ease both; }
  @keyframes fadeIn { from { opacity:0; transform:translateY(5px); } to { opacity:1; transform:none; } }
  @media (prefers-reduced-motion: reduce) { #app.fade-in, .sheet, .toast { animation:none !important; transition:none !important; } }
  :focus-visible { outline:2px solid var(--gold); outline-offset:2px; }
  html.theme-anim, html.theme-anim body, html.theme-anim .tabs { transition:background-color .3s ease, color .3s ease; }

  /* ====== עטיפה (לכל סדר צבע משלו) ====== */
  .cover { position:relative; overflow:hidden; flex-shrink:0; border-radius:12px; color:#fff;
    display:flex; flex-direction:column; justify-content:flex-end; padding:10px; background:linear-gradient(150deg, var(--ca), var(--cb)); }
  .cover::before { content:''; position:absolute; inset:0; background:radial-gradient(circle at 80% 0%, rgba(255,255,255,.22), transparent 58%); }
  .cover::after { content:''; position:absolute; top:10px; left:10px; width:15px; height:15px; border:1.5px solid rgba(255,255,255,.5); border-radius:50%; }
  .cover b { position:relative; font-family:'Frank Ruhl Libre',serif; font-weight:900; line-height:1.02; font-size:var(--fs, 22px); text-shadow:0 2px 8px rgba(0,0,0,.25); }
  .cover i { position:relative; font-style:normal; font-size:10.5px; opacity:.82; margin-top:3px; }
  .cover.plain { padding:0; }
  .cover.plain::after, .cover.sm::after { display:none; }

  /* ====== דף הבית ====== */
  .home-top { display:flex; justify-content:space-between; align-items:center; padding:16px 18px 0; }
  .greet { font-family:'Frank Ruhl Libre',serif; font-weight:900; font-size:27px; line-height:1.1; }
  .greet-s { font-size:12.5px; color:var(--muted); margin-top:3px; line-height:1.45; }
  .home-side { display:flex; align-items:center; gap:8px; flex-shrink:0; }
  .theme-btn { all:unset; cursor:pointer; width:40px; height:40px; border-radius:50%; display:inline-flex; align-items:center; justify-content:center; background:var(--surface2); color:var(--text); }
  .theme-btn:focus-visible { outline:2px solid var(--gold); }
  .avatar { width:40px; height:40px; border-radius:50%; flex-shrink:0; border:2px solid var(--gold); background:url('bg-rabbi.jpg') 55% 30% / cover; }
  .all-link { display:inline-flex; align-items:center; gap:3px; margin:12px 18px 0; padding:6px 12px 6px 11px; border-radius:999px;
    background:var(--surface2); color:var(--text2); font-size:13px; font-weight:600; text-decoration:none; }
  .all-link + .home-top { padding-top:10px; }
  .install { display:flex; align-items:center; gap:12px; margin:14px 18px 0; padding:12px 14px; background:var(--surface); border:1px solid var(--line); border-radius:14px; }
  .install img { width:42px; height:42px; border-radius:10px; flex-shrink:0; }
  .install-gr { flex:1; min-width:0; }
  .install-t { font-weight:700; font-size:14.5px; }
  .install-s { font-size:12.5px; color:var(--muted); margin-top:1px; line-height:1.4; }
  .install-go { background:var(--btn); color:var(--btn-ink); border:0; border-radius:18px; padding:7px 14px; font-weight:700; font-size:13.5px; cursor:pointer; flex-shrink:0; font-family:inherit; }
  .install-x { background:none; border:0; color:var(--muted); cursor:pointer; padding:4px; flex-shrink:0; display:inline-flex; }
  .search-fake { all:unset; box-sizing:border-box; cursor:pointer; display:flex; align-items:center; gap:9px; width:calc(100% - 36px); margin:14px 18px 0;
    background:var(--surface2); border-radius:12px; padding:12px 14px; font-size:14.5px; color:var(--muted); }

  .daily { position:relative; margin:14px 18px 0; border-radius:18px; padding:16px; overflow:hidden; color:var(--text); cursor:pointer;
    background:linear-gradient(135deg, #7a2a28, #3d1414); box-shadow:0 10px 26px rgba(0,0,0,.22); }
  .daily::after { content:''; position:absolute; left:-34px; top:-34px; width:150px; height:150px; border-radius:50%; border:18px solid rgba(227,194,122,.12); pointer-events:none; }
  .daily-tag { font-size:11px; font-weight:800; color:var(--gold); letter-spacing:.5px; }
  .daily-t { font-family:'Frank Ruhl Libre',serif; font-weight:900; font-size:23px; margin-top:4px; line-height:1.2; }
  .daily-s { font-size:12.5px; color:rgba(243,231,214,.82); margin-top:3px; }
  .daily-row { display:flex; align-items:flex-end; justify-content:space-between; gap:12px; margin-top:14px; position:relative; z-index:1; }
  .daily-bar { height:5px; border-radius:3px; background:rgba(255,255,255,.15); width:100%; max-width:220px; overflow:hidden; }
  .daily-bar i { display:block; height:100%; background:var(--gold); border-radius:3px; }
  .daily-bs { font-size:11px; color:rgba(243,231,214,.75); margin-top:5px; }
  .daily .play-btn { width:52px; height:52px; background:var(--gold); color:var(--gold-ink); box-shadow:0 6px 16px rgba(0,0,0,.35); }
  .now-line { all:unset; box-sizing:border-box; cursor:pointer; display:flex; align-items:center; gap:8px; width:calc(100% - 36px); margin:10px 18px 0;
    font-size:12.5px; color:var(--muted); }
  .now-line b { color:var(--text); font-weight:700; }
  .now-dot { width:8px; height:8px; border-radius:50%; background:#d9534f; box-shadow:0 0 0 3px rgba(217,83,79,.2); flex-shrink:0; }

  .sec { display:flex; justify-content:space-between; align-items:baseline; margin:24px 18px 11px; }
  .sec h3 { font-weight:800; font-size:18px; }
  .sec .link { font-size:13px; color:var(--muted); font-weight:600; background:none; border:0; cursor:pointer; }

  .shelf { display:flex; gap:12px; padding:0 18px 4px; overflow-x:auto; scroll-snap-type:x mandatory; scrollbar-width:none; }
  .shelf::-webkit-scrollbar { display:none; }
  .tile { all:unset; flex:0 0 122px; scroll-snap-align:start; cursor:pointer; }
  .tile .cover { width:122px; height:122px; }
  .tile-t { font-weight:700; font-size:14px; margin-top:8px; }
  .tile-s { font-size:11.5px; color:var(--muted); margin-top:2px; }
  .mini-bar { height:3px; border-radius:2px; background:var(--track); margin-top:6px; overflow:hidden; }
  .mini-bar i { display:block; height:100%; background:var(--prog); }

  .arch { display:grid; grid-template-columns:1fr 1fr; gap:8px; margin:0 18px; }
  .vol { all:unset; cursor:pointer; display:flex; align-items:center; gap:11px; height:58px; overflow:hidden; border-radius:10px; background:var(--surface); }
  .vol:hover { background:var(--surface2); }
  .vol .cover { width:58px; height:58px; border-radius:0; }
  .vol-n { font-weight:700; font-size:14.5px; }
  .vol-c { font-size:11.5px; color:var(--muted); }
  .vol.empty { opacity:.5; }
  html[data-theme="light"] .vol, html[data-theme="light"] .empty-box, html[data-theme="light"] .pk { border:1px solid var(--line); }

  .unmatched { margin:22px 18px 0; font-size:13px; color:var(--muted); }
  .unmatched summary { cursor:pointer; }
  .unmatched ul { margin:8px 18px 0 0; }
  .unmatched p { margin-top:8px; }
  .dedic { text-align:center; font-size:12.5px; color:var(--muted2); margin:34px 18px 0; font-family:'Frank Ruhl Libre',serif; }

  /* ====== דפים פנימיים ====== */
  .tint { position:absolute; top:0; left:0; right:0; height:400px; pointer-events:none;
    background:linear-gradient(180deg, var(--ca) 0%, color-mix(in srgb, var(--cb) 70%, var(--bg)) 45%, var(--bg) 100%); opacity:.9; }
  html[data-theme="light"] .tint { background:linear-gradient(180deg, color-mix(in srgb, var(--ca) 50%, var(--bg)) 0%, color-mix(in srgb, var(--ca) 16%, var(--bg)) 45%, var(--bg) 100%); opacity:1; }
  .page { position:relative; }
  .topbar { display:flex; align-items:center; gap:10px; padding:12px 12px 4px; }
  .back-btn { all:unset; cursor:pointer; width:40px; height:40px; border-radius:50%; display:inline-flex; align-items:center; justify-content:center; background:var(--glass); }
  .crumb { font-size:13px; color:var(--muted); }
  .hdr { display:flex; gap:16px; align-items:flex-end; padding:10px 18px 0; }
  .hdr .cover { width:124px; height:124px; box-shadow:0 14px 34px rgba(0,0,0,.4); }
  .hdr-t { font-family:'Frank Ruhl Libre',serif; font-weight:900; font-size:clamp(25px,7vw,30px); line-height:1.1; }
  .hdr-s { font-size:12.5px; color:var(--muted); margin-top:4px; line-height:1.45; }
  .ptitle { font-family:'Frank Ruhl Libre',serif; font-weight:900; font-size:clamp(26px,7.5vw,31px); padding:10px 18px 0; line-height:1.15; }
  .psub { font-size:13px; color:var(--muted); padding:4px 18px 0; }
  .page-top { padding-top:18px; }
  .page-top .psub { padding-bottom:6px; }
  .prog-row { display:flex; align-items:center; gap:12px; margin:16px 18px 0; font-size:12px; color:var(--muted); }
  .prog-row .bar { flex:1; height:5px; border-radius:3px; background:var(--track); overflow:hidden; }
  .prog-row .bar i { display:block; height:100%; background:var(--prog); border-radius:3px; }
  .ctl { display:flex; justify-content:space-between; align-items:center; padding:14px 18px 6px; gap:10px; }
  .ctl-l { display:flex; gap:4px; }
  .ctl .icon-btn { width:42px; height:42px; }
  .ctl-r { display:flex; align-items:center; gap:10px; }
  .next-l { font-size:12px; color:var(--muted); text-align:left; line-height:1.35; }
  .next-l b { color:var(--text); }
  .big-play { width:56px; height:56px; border-radius:50%; border:0; cursor:pointer; flex-shrink:0; display:inline-flex; align-items:center; justify-content:center;
    background:var(--btn); color:var(--btn-ink); box-shadow:0 8px 20px rgba(0,0,0,.25); transition:transform .12s ease; }
  .big-play:hover { transform:scale(1.05); }
  .acts-row { display:flex; gap:8px; padding:14px 18px 6px; flex-wrap:wrap; }
  .pill-btn { display:inline-flex; align-items:center; gap:6px; cursor:pointer; flex-shrink:0; background:var(--btn); color:var(--btn-ink); border:0; border-radius:20px; padding:8px 15px; font-weight:700; font-size:13.5px; text-decoration:none; }
  .pill-out { display:inline-flex; align-items:center; gap:6px; cursor:pointer; flex-shrink:0; background:none; color:var(--text2); border:1.5px solid var(--line); border-radius:20px; padding:7px 14px; font-weight:600; font-size:13px; text-decoration:none; }
  .sub-h { font-weight:800; font-size:17px; margin:22px 18px 8px; }
  .list-head { display:flex; align-items:center; justify-content:space-between; gap:10px; margin:22px 18px 8px; }
  .list-head .sub-h { margin:0; }

  /* רשת הפרקים עם טבעות התקדמות */
  .pgrid { display:grid; grid-template-columns:repeat(3,1fr); gap:10px; padding:12px 18px; }
  .pk { all:unset; box-sizing:border-box; cursor:pointer; display:flex; flex-direction:column; align-items:center; gap:6px; padding:12px 6px 10px; border-radius:14px; background:var(--surface); }
  .pk:hover { background:var(--surface2); }
  .pk.cur { outline:1.5px solid var(--gold); }
  html[data-theme="light"] .pk.cur { outline-color:var(--hl); }
  .pk-n { font-family:'Frank Ruhl Libre',serif; font-weight:700; font-size:16px; }
  .pk-c { font-size:11px; color:var(--muted); }
  .pk.off { opacity:.4; }
  .ring { width:44px; height:44px; }
  .ring .trk { stroke:var(--track); }
  .ring .val { stroke:var(--gold); }
  html[data-theme="light"] .ring .val { stroke:var(--hl); }
  .ring .ok { stroke:var(--done); }
  .ring text { fill:var(--text); font-family:'Heebo',sans-serif; }

  /* שורות מסכת/סדר */
  .plist { display:flex; flex-direction:column; gap:2px; margin:6px 8px 0; }
  .prow { all:unset; cursor:pointer; display:flex; align-items:center; gap:12px; padding:8px 10px; border-radius:10px; }
  .prow:hover { background:var(--hover); }
  .prow .cover { width:50px; height:50px; border-radius:8px; }
  .prow-gr { flex:1; min-width:0; }
  .prow-n { font-weight:700; font-size:15.5px; }
  .prow-s { font-size:12px; color:var(--muted); margin-top:1px; }
  .prow-c { color:var(--muted2); display:inline-flex; }
  .prow.empty { opacity:.45; }

  /* ====== שורת משנה ====== */
  .shiur-row { display:flex; align-items:center; gap:12px; padding:10px 18px; cursor:pointer; position:relative; border-bottom:1px solid var(--line); }
  .shiur-row:hover { background:var(--hover); }
  .shiur-row.hl { background:color-mix(in srgb, var(--hl) 10%, transparent); }
  .shiur-row .cover { width:48px; height:48px; border-radius:8px; }
  .shiur-gr { flex:1; min-width:0; }
  .shiur-title { font-weight:700; font-size:15.5px; line-height:1.3; text-wrap:balance; }
  .shiur-row.playing .shiur-title { color:var(--hl); }
  .snip { font-family:'Frank Ruhl Libre',serif; font-size:13.5px; color:var(--text2); opacity:.85; margin-top:2px; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
  .snip:empty { display:none; }
  .shiur-sub { display:flex; align-items:center; gap:8px; margin-top:2px; flex-wrap:wrap; }
  .shiur-meta { font-size:12px; color:var(--muted); }
  .shiur-meta .done { color:var(--done); font-weight:700; }
  .shiur-bar { height:3px; background:var(--track); border-radius:2px; margin-top:6px; max-width:220px; overflow:hidden; }
  .shiur-bar i { display:block; height:100%; width:0; background:var(--prog); transition:width .3s linear; }
  .shiur-row:not(.started) .shiur-bar { display:none; }
  .shiur-row.is-done .shiur-bar i { background:var(--done); opacity:.6; }
  .shiur-acts { display:flex; align-items:center; flex-shrink:0; }
  /* עיגול המספר של המשנה = כפתור הניגון (אות / ✓ / השהיה) */
  .num { width:38px; height:38px; border-radius:50%; border:0; cursor:pointer; flex-shrink:0; display:inline-flex; align-items:center; justify-content:center;
    background:var(--surface2); color:var(--hl); font-family:'Frank Ruhl Libre',serif; font-weight:700; font-size:15px; }
  .shiur-row.is-done .num { background:color-mix(in srgb, var(--done) 18%, transparent); color:var(--done); }
  .shiur-row.playing .num { background:var(--btn); color:var(--btn-ink); }
  .play-btn { width:40px; height:40px; border-radius:50%; border:0; cursor:pointer; flex-shrink:0; display:inline-flex; align-items:center; justify-content:center; background:var(--surface2); color:var(--text); }

  .sheet { position:fixed; inset:0; z-index:50; color:var(--text); background:linear-gradient(180deg, var(--ca), color-mix(in srgb, var(--cb) 55%, var(--bg)) 40%, var(--bg) 72%);

  .sheet-in { width:100%; max-width:460px; padding:calc(10px + var(--safe-t)) 22px calc(22px + var(--safe-b)); display:flex; flex-direction:column; }

  .dlbar { position:fixed; left:50%; transform:translateX(-50%); bottom:calc(var(--tabs-h) + var(--mini-h) + var(--safe-b) + 18px); z-index:61;

    .badge { position:static; }
    .mini { left:50%; right:auto; width:720px; transform:translateX(-50%); bottom:16px; }
    .sheet { background:rgba(8,3,4,.6); align-items:center; animation:fadeIn .2s ease both; }

  }
