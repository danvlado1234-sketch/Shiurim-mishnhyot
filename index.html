  const masechetOrder = {}; // מסכת -> מקום בסדר הכללי של המשנה
  let ord = 0;
  for (const s of SEDARIM) for (const m of s.masechtot){ sederOf[m] = s.name; masechetOrder[m] = ord++; }
  function colorVars(seder){ const c = SEDER_COLORS[seder] || SEDER_COLORS['זרעים']; return `--ca:${c[0]};--cb:${c[1]}`; }

  // ====== מספרים עבריים ======
  // ממיר מספר לאותיות גימטריה (1 -> א, 15 -> טו, 21 -> כא)
  function toHebrewNumeral(num){
    if (!num || num < 1) return String(num);
    const ones = ['','א','ב','ג','ד','ה','ו','ז','ח','ט'];
    const tens = ['','י','כ','ל','מ','נ','ס','ע','פ','צ'];
    const hundreds = ['','ק','ר','ש','ת'];
    let n = num, out = '';
    out += hundreds[Math.floor(n/100)] || '';
    n = n % 100;
    // טיפול מיוחד ב-15 (טו) ו-16 (טז) כדי לא לכתוב שם השם
    if (n === 15) { out += 'טו'; n = 0; }
    else if (n === 16) { out += 'טז'; n = 0; }
    else { out += tens[Math.floor(n/10)] || ''; n = n % 10; out += ones[n] || ''; }
    return out;
  }
  const heb = toHebrewNumeral;

  // ממיר אות גימטריה או מספר למספר. מחזיר null אם לא מספר.
  const HEB_VALUES = {'א':1,'ב':2,'ג':3,'ד':4,'ה':5,'ו':6,'ז':7,'ח':8,'ט':9,
                      'י':10,'כ':20,'ל':30,'מ':40,'נ':50,'ס':60,'ע':70,'פ':80,'צ':90,
                      'ק':100,'ר':200,'ש':300,'ת':400,'ך':20,'ם':40,'ן':50,'ף':80,'ץ':90};
  function parseHebrewNumber(token){
    if (!token) return null;
    if (/^\d+$/.test(token)) return parseInt(token, 10);
    if (/^[א-ת]+$/.test(token)){
      let sum = 0;
      for (const ch of token){ if (!(ch in HEB_VALUES)) return null; sum += HEB_VALUES[ch]; }
      return sum > 0 ? sum : null;
    }
    return null;
  }

  function normalize(s){ return (s||'').replace(/[֑-ׇ]/g,'').replace(/\s+/g,'').trim(); }

  function findCanonical(name){
    const n = normalize(name);
    for (const seder of SEDARIM) for (const m of seder.masechtot) if (normalize(m) === n) return m;
    return null;
  }

  // מנתח שאילתת חיפוש: "ברכות פרק א משנה ב" / "ברכות א ב" / "ברכות 1 2" / "ברכות"
  // מחזיר { masechet, perek, mishna } - כל שדה שלא זוהה יהיה null
  function parseSearchQuery(raw){
    const result = { masechet: null, perek: null, mishna: null, masechetPartial: '' };
    if (!raw) return result;
    let tokens = raw.replace(/[֑-ׇ"'״׳]/g,'').split(/\s+/).filter(Boolean);
    const numbers = [], words = [];
    for (const t of tokens){
      if (t === 'פרק' || t === 'משנה' || t === 'פ' || t === 'מ' || t === 'מסכת') continue; // מילות עזר
      const num = parseHebrewNumber(t);
      // מילה שהיא כולה מספר/אות בודדת -> מספר. אחרת -> חלק משם המסכת
      if (num !== null && (/^\d+$/.test(t) || t.length <= 2) && words.length > 0) numbers.push(num);
      else words.push(t);
    }
    const masechetText = words.join(' ');
    result.masechetPartial = masechetText;
    result.masechet = findCanonical(masechetText);
    if (numbers.length >= 1) result.perek = numbers[0];
    if (numbers.length >= 2) result.mishna = numbers[1];
    return result;
  }

  // מפענח ערך משנה שעשוי להיות בודד ('ג') או מאוחד ('ג,ד' / 'ג-ד' / 'ג_ד').
  function parseMishnaValue(parts, startIdx){
    const raw = parts.slice(startIdx).join('_');
    const pieces = raw.split(/[,\-_]+/).map(s => s.trim()).filter(Boolean);
    if (!pieces.length) return null;
    const nums = [];
    for (const p of pieces){ const n = parseHebrewNumber(p); if (n === null) return null; nums.push(n); }
    return { num: nums[0], extra: nums.slice(1), label: nums.map(toHebrewNumeral).join('-') };
  }

  // מפענח שם קובץ בשני פורמטים:
  //   פורמט א' (של אבא): מסכת_פרק_א_משנה_יא.m4a  (אותיות גימטריה; תומך גם במשנה מאוחדת: משנה_ג,_ד)
  //   פורמט ב' (ישן):    מסכת_1_11_תאריך.mp3     (מספרים, עם או בלי תאריך)
  function parseFilename(filename){
    const nameOnly = filename.split('/').pop();
    const base = nameOnly.replace(/\.(mp3|m4a)$/i, '').replace(/^_+|_+$/g, '');
    const parts = base.split('_').filter(Boolean);
    const iPerek = parts.indexOf('פרק');
    const iMishna = parts.indexOf('משנה');
    if (iPerek > 0 && iMishna > iPerek && parts[iPerek + 1] && parts[iMishna + 1]){
      const masechet = findCanonical(parts.slice(0, iPerek).join(' '));
      const perek = parseHebrewNumber(parts[iPerek + 1]);
      const mv = parseMishnaValue(parts, iMishna + 1);
      if (masechet && perek && mv) return { masechet, perek, mishna: mv.num, extra: mv.extra, label: mv.label, date: '', source: 'r2' };
      return null;
    }
    const iNum = parts.findIndex(p => /^\d+$/.test(p));
    if (iNum > 0 && iNum + 1 < parts.length && /^\d+$/.test(parts[iNum + 1])){
      const masechet = findCanonical(parts.slice(0, iNum).join(' '));
      const perek = parseInt(parts[iNum], 10);
      const mishna = parseInt(parts[iNum + 1], 10);
      const date = parts.slice(iNum + 2).join('_');
      if (masechet && !isNaN(perek) && !isNaN(mishna)){
        // קבצים ישנים עם תאריך יושבים ב-GitHub; קבצים בלי תאריך - ב-R2
        return { masechet, perek, mishna, extra: [], label: toHebrewNumeral(mishna), date, source: date ? 'github' : 'r2' };
      }
    }
    return null;
  }

  function fileUrl(path, source){
    if (source === 'github') return `${CONFIG.folder}/${encodeURIComponent(path)}`;
    return `${CONFIG.audioBase}/${path.split('/').map(encodeURIComponent).join('/')}`;
  }

  // ====== מצב ======
  let index = {};        // מסכת -> פרק -> [משנה,...]
  let byPath = {};       // נתיב -> משנה
  let seq = [];          // כל המשניות לפי סדר המשנה (סדר, מסכת, פרק, משנה)
  let unmatched = [];
  let uploadDates = {};  // נתיב -> תאריך העלאה (uploads.json)
  let view = { type:'shelf' };
  const app = document.getElementById('app');

  function buildIndex(paths){
    index = {}; byPath = {}; unmatched = []; seq = [];
    for (const path of paths){
      if (!/\.(mp3|m4a)$/i.test(path)) continue;
      const p = parseFilename(path);
      if (!p){ unmatched.push(path); continue; }
      const s = Object.assign(p, { path, filename: path.split('/').pop(), seder: sederOf[p.masechet], url: fileUrl(path, p.source) });
      index[s.masechet] = index[s.masechet] || {};
      (index[s.masechet][s.perek] = index[s.masechet][s.perek] || []).push(s);
      byPath[path] = s;
      seq.push(s);
    }
    seq.sort((a, b) => masechetOrder[a.masechet] - masechetOrder[b.masechet] || a.perek - b.perek || a.mishna - b.mishna);
    seq.forEach((s, i) => s.seq = i);
    for (const m in index) for (const p in index[m]) index[m][p].sort((a, b) => a.mishna - b.mishna);
  }
  function totalCount(){ return seq.length; }
  function inMasechet(m){ return seq.filter(s => s.masechet === m); }
  function nShiurim(n){ return n === 1 ? 'שיעור אחד' : n + ' שיעורים'; }
  function nMishnayot(n){ return n === 1 ? 'משנה אחת' : n + ' משניות'; }

  // ====== אייקונים ======
  function svg(size, body, extra){ return `<svg width="${size}" height="${size}" viewBox="0 0 24 24" ${extra == null ? 'fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"' : extra}>${body}</svg>`; }
  const iconPlay  = n => svg(n, '<path d="M8 5v14l11-7z" fill="currentColor"/>', '');
  const iconPause = n => svg(n, '<path d="M7 5h4v14H7zM13 5h4v14h-4z" fill="currentColor"/>', '');
  const iconBack15 = n => svg(n, '<path d="M3 12a9 9 0 1 0 3-6.7L3 8"/><path d="M3 3v5h5"/><text x="12" y="15.5" font-size="7.5" font-family="Heebo,sans-serif" font-weight="700" fill="currentColor" stroke="none" text-anchor="middle">15</text>', 'fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"');
  const iconFwd15  = n => svg(n, '<path d="M21 12a9 9 0 1 1-3-6.7L21 8"/><path d="M21 3v5h-5"/><text x="12" y="15.5" font-size="7.5" font-family="Heebo,sans-serif" font-weight="700" fill="currentColor" stroke="none" text-anchor="middle">15</text>', 'fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"');
  const ICON_BM    = svg(20, '<path d="M6 3h12v18l-6-4-6 4z"/>');
  const ICON_BM_ON = svg(20, '<path d="M6 3h12v18l-6-4-6 4z" fill="currentColor"/>');
  const ICON_MORE  = svg(20, '<circle cx="12" cy="5" r="1.9"/><circle cx="12" cy="12" r="1.9"/><circle cx="12" cy="19" r="1.9"/>', 'fill="currentColor"');
  const ICON_LINK  = svg(17, '<path d="M10 13a5 5 0 0 0 7.54.54l3-3a5 5 0 0 0-7.07-7.07l-1.72 1.71"/><path d="M14 11a5 5 0 0 0-7.54-.54l-3 3a5 5 0 0 0 7.07 7.07l1.71-1.71"/>');
  const ICON_CHECK = svg(17, '<circle cx="12" cy="12" r="9.5"/><path d="m7.5 12.5 3 3 6-6.5"/>');
  const ICON_AUDIO_DL = svg(17, '<path d="M3 18v-6a9 9 0 0 1 18 0v6"/><path d="M21 19a2 2 0 0 1-2 2h-1v-6h3z"/><path d="M3 19a2 2 0 0 0 2 2h1v-6H3z"/><path d="M12 9v7"/><path d="m9 13 3 3 3-3"/>');
  const ICON_BOOK  = svg(17, '<path d="M4 19.5A2.5 2.5 0 0 1 6.5 17H20"/><path d="M6.5 2H20v20H6.5A2.5 2.5 0 0 1 4 19.5v-15A2.5 2.5 0 0 1 6.5 2z"/>');
  const ICON_BACK  = svg(20, '<path d="m9 6 6 6-6 6"/>', 'fill="none" stroke="currentColor" stroke-width="2.3" stroke-linecap="round" stroke-linejoin="round"');
  const ICON_UP    = svg(15, '<path d="m9 6 6 6-6 6"/>', 'fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"');
  const ICON_CLOSE = svg(18, '<path d="M6 6l12 12M18 6 6 18"/>', 'fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"');
  const ICON_CHEV  = svg(16, '<path d="m15 6-6 6 6 6"/>', 'fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"');
  const ICON_SEARCH = svg(17, '<circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5"/>');
  const ICON_SHARE = svg(21, '<path d="M4 12v7h16v-7"/><path d="M12 3v12"/><path d="m8 7 4-4 4 4"/>');
  const ICON_NEXT  = svg(20, '<path d="M6 5v14l10-7z"/><path d="M18 5v14"/>');
  const ICON_LOOP  = svg(21, '<path d="M17 2l4 4-4 4"/><path d="M3 11v-1a4 4 0 0 1 4-4h14"/><path d="M7 22l-4-4 4-4"/><path d="M21 13v1a4 4 0 0 1-4 4H3"/>');
  const ICON_SUN  = svg(20, '<circle cx="12" cy="12" r="4.2"/><path d="M12 2.5v2M12 19.5v2M4.6 4.6l1.4 1.4M18 18l1.4 1.4M2.5 12h2M19.5 12h2M4.6 19.4 6 18M18 6l1.4-1.4"/>');
  const ICON_MOON = svg(20, '<path d="M20 14.5A8.5 8.5 0 0 1 9.5 4a8.5 8.5 0 1 0 10.5 10.5z"/>');

  function escAttr(s){ return String(s).replace(/&/g, '&amp;').replace(/"/g, '&quot;'); }
  function escHtml(s){ return String(s).replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;'); }

  // ====== עטיפות ======
  function coverHtml(seder, text, sub, cls, base, id){
    const len = Math.max(String(text || '').length, 1);
    const fs = Math.round((base || 22) * Math.max(0.5, Math.min(1, 6 / len)));
    return `<span class="cover${cls ? ' ' + cls : ''}"${id ? ` id="${id}"` : ''} style="${colorVars(seder)};--fs:${fs}px">${text ? `<b>${text}</b>` : ''}${sub ? `<i>${sub}</i>` : ''}</span>`;
  }
  const masechetCover = (m, cls, base, sub, id) => coverHtml(sederOf[m], m, sub == null ? 'סדר ' + sederOf[m] : sub, cls, base, id);

  // ====== כותרות וקישורים ======
  function shiurTitle(s){ return `${s.masechet} · פרק ${heb(s.perek)} · משנה ${s.label}`; }
  function shortRef(s){ return `${s.masechet} ${heb(s.perek)} ${s.label}`; }
  function directLink(s){ return `${location.origin}${location.pathname}?m=${encodeURIComponent(s.masechet)}&p=${s.perek}&n=${s.mishna}`; }
  function sefariaLink(masechet, perek, mishna){
    const name = SEFARIA_NAMES[masechet];
    if (!name) return null;
    return `https://www.sefaria.org.il/Mishnah_${name.replace(/ /g, '_')}${perek ? '.' + perek : ''}${mishna ? '.' + mishna : ''}`;
  }
  function formatDate(d){
    const parts = (d||'').split('-');
    if (parts.length !== 3) return d || '';
    return `${parts[2]}.${parts[1]}.${parts[0]}`;
  }
  function parseDay(d){ const m = /^(\d{4})-(\d{2})-(\d{2})/.exec(d || ''); return m ? new Date(+m[1], m[2] - 1, +m[3]) : null; }
  function dayLabel(d){
    const day = parseDay(d); if (!day) return '';
    const now = new Date(); const today = new Date(now.getFullYear(), now.getMonth(), now.getDate());
    const diff = Math.round((today - day) / 86400000);
    return diff === 0 ? 'היום' : diff === 1 ? 'אתמול' : 'ב-' + day.toLocaleDateString('he-IL', { day:'numeric', month:'long' });
  }

  function fallbackCopy(url){
    const ta = document.createElement('textarea');
    ta.value = url; ta.style.position = 'fixed'; ta.style.opacity = '0';
    document.body.appendChild(ta); ta.select();
    try { document.execCommand('copy'); showToast('הקישור הועתק'); } catch (e){ showToast('לא הצלחנו להעתיק — נסו שוב'); }
    document.body.removeChild(ta);
  }
  function copyLink(url){
    if (navigator.clipboard && navigator.clipboard.writeText) navigator.clipboard.writeText(url).then(() => showToast('הקישור הועתק'), () => fallbackCopy(url));
    else fallbackCopy(url);
  }

  // ====== טקסט המשנה (ספריא) ======
  // נטען פרק שלם בבת אחת ונשמר במכשיר (הטקסט לא משתנה). קודם בקשה רגילה;
  // אם הדפדפן חוסם אותה - דרך JSONP (ספריא תומכת ב-callback). אם גם זה
  // נכשל (אין אינטרנט) - מציגים קישור לספריא במקום הטקסט.
  const TXT_PREFIX = 'mishna:txt:';
  const txtMem = {};
  function sefRef(masechet, perek){ const n = SEFARIA_NAMES[masechet]; return n ? `Mishnah_${n.replace(/ /g, '_')}.${perek}` : null; }
  function cleanText(t){ return String(t || '').replace(/<[^>]+>/g, '').replace(/&nbsp;/g, ' ').replace(/\s+/g, ' ').trim(); }
  function jsonp(url){
    return new Promise((resolve, reject) => {
      const cb = '__sef' + Math.random().toString(36).slice(2);
      const sc = document.createElement('script');
      const t = setTimeout(() => { cleanup(); reject(new Error('timeout')); }, 9000);
      function cleanup(){ clearTimeout(t); delete window[cb]; sc.remove(); }
      window[cb] = (d) => { cleanup(); resolve(d); };
      sc.onerror = () => { cleanup(); reject(new Error('jsonp')); };
      sc.src = url + (url.includes('?') ? '&' : '?') + 'callback=' + cb;
      document.head.appendChild(sc);
    });
  }
  function getPerekText(masechet, perek){
    const ref = sefRef(masechet, perek);
    if (!ref) return Promise.resolve(null);
    if (txtMem[ref]) return txtMem[ref];
    try { const c = localStorage.getItem(TXT_PREFIX + ref); if (c) return (txtMem[ref] = Promise.resolve(JSON.parse(c))); } catch (e) {}
    const ctrl = ('AbortController' in window) ? new AbortController() : null;
    const timer = setTimeout(() => ctrl && ctrl.abort(), 9000);
    const p = fetch(`https://www.sefaria.org/api/v3/texts/${ref}?version=hebrew&return_format=text_only`, ctrl ? { signal: ctrl.signal } : {})
      .then(r => { if (!r.ok) throw new Error('http'); return r.json(); })
      .then(d => { const v = d && d.versions && d.versions[0]; if (!v || !Array.isArray(v.text)) throw new Error('fmt'); return v.text; })
      .catch(() => jsonp(`https://www.sefaria.org/api/texts/${ref}?context=0&commentary=0&pad=0`).then(d => { if (!d || !Array.isArray(d.he)) throw new Error('fmt'); return d.he; }))
      .then(arr => {
        const clean = arr.map(cleanText);
        try { localStorage.setItem(TXT_PREFIX + ref, JSON.stringify(clean)); } catch (e) {}
        return clean;
      })
      .catch(() => { delete txtMem[ref]; return null; })
      .finally(() => clearTimeout(timer));
    return (txtMem[ref] = p);
  }
  // טקסט של משנה (כולל משנה מאוחדת, למשל ג-ד)
  function mishnaText(arr, s){ if (!arr || !s) return null; const nums = [s.mishna].concat(s.extra || []); const t = nums.map(n => arr[n - 1]).filter(Boolean); return t.length ? t.join(' ') : null; }
  function snippet(t){ return t ? t.replace(/[֑-ׇ]/g, '').split(' ').slice(0, 8).join(' ') + '…' : ''; }

  // ====== זיכרון האזנה (התקדמות, נשמע, הרשימה שלי) ======
  // נשמר בדפדפן של המכשיר בלבד. המפתחות מתחילים ב-"mishna:" כי אתר הפרשות
  // יושב באותה כתובת וחולק את אותו אחסון (שם: "parasha:"). כל הגישה דרך
  // getProg/setProg - לחיבור עתידי להרשמה.
  const STORE_KEY = 'mishna:progress';
  let progress = {};
  try { progress = JSON.parse(localStorage.getItem(STORE_KEY) || '{}') || {}; } catch (e) { progress = {}; }
  let saveTimer = null;
  // שמירה עם מיזוג: אם בינתיים נשמר משהו חדש יותר (בלשונית אחרת, או באפליקציה
  // ובדפדפן במקביל) - לכל משנה נשמר המצב העדכני ביותר, ולא דורסים אותו.
  function saveProgress(){
    clearTimeout(saveTimer); saveTimer = null;
    try {
      const disk = JSON.parse(localStorage.getItem(STORE_KEY) || '{}') || {};
      for (const k in disk) if (!progress[k] || (disk[k].at || 0) > (progress[k].at || 0)) progress[k] = disk[k];
      localStorage.setItem(STORE_KEY, JSON.stringify(progress));
    } catch (e) {}
  }
  function saveSoon(){ if (!saveTimer) saveTimer = setTimeout(saveProgress, 4000); }
  function getProg(path){ return progress[path] || null; }
  const isDone = path => !!(progress[path] && progress[path].done);
  function setProg(path, patch){
    const prev = progress[path] || {};
    const next = Object.assign({}, prev, patch, { at: Date.now() });
    const becameDone = next.done && !prev.done;
    if (becameDone){ next.doneAt = Date.now(); next.saved = false; }
    progress[path] = next;
    saveSoon();
    if (becameDone) setTimeout(() => celebrate(path), 400);
  }
  // סיום פרק / מסכת - הודעה קטנה
  function celebrate(path){
    const s = byPath[path]; if (!s) return;
    const perekAll = (index[s.masechet] || {})[s.perek] || [];
    const mAll = inMasechet(s.masechet);
    const fullyRecorded = Object.keys(index[s.masechet] || {}).length >= (PEREK_COUNTS[s.masechet] || 0);
    if (fullyRecorded && mAll.every(x => isDone(x.path))) showToast(`סיימת את מסכת ${s.masechet}! 🎉`);
    else if (perekAll.length > 1 && perekAll.every(x => isDone(x.path))) showToast(`סיימת את פרק ${heb(s.perek)} במסכת ${s.masechet} 🎉`);
  }

  function listOf(pred, sortKey, desc){
    return Object.keys(progress).filter(path => byPath[path] && pred(progress[path]))
      .sort((a, b) => ((progress[a][sortKey] || 0) - (progress[b][sortKey] || 0)) * (desc ? -1 : 1)).map(path => byPath[path]);
  }
  function savedList(){ return listOf(p => p.saved && !p.done, 'savedAt', false); }
  function continueList(){ return listOf(p => !p.saved && !p.done && p.t > 5, 'at', true).slice(0, 10); }
  function heardList(){ return listOf(p => p.done, 'doneAt', true).slice(0, 12); }

  function toggleSaved(path){
    const p = getProg(path) || {};
    setProg(path, p.saved ? { saved: false } : Object.assign({ saved: true, savedAt: Date.now() }, p.done ? { done: false, t: 0 } : {}));
    saveProgress(); refreshCards(path); updateBadges(); updateSheet();
    showToast(p.saved ? 'הוסר מהרשימה שלי' : 'נוסף לרשימה שלי');
  }
  function toggleHeard(path){
    const p = getProg(path) || {};
    setProg(path, p.done ? { done: false, t: 0 } : { done: true });
    saveProgress(); refreshCards(path); updateBadges();
  }
  const DONE_RATIO = 0.9;   // מ-90% המשנה נחשבת "נשמעה"

  // ====== הלימוד: איפה השיעור עומד, ואיפה אני ======
  // "השיעור עכשיו" = המשנה האחרונה שהועלתה (העלאה רגילה; השלמות לא נרשמות).
  // כשמתחילים מסכת חדשה - זה מתעדכן לבד, בלי שום הגדרה.
  function shiurNow(){
    let best = null, bestD = '';
    for (const path in uploadDates){
      const s = byPath[path]; if (!s) continue;
      const d = uploadDates[path];
      if (d > bestD || (d === bestD && s.seq > best.seq)){ best = s; bestD = d; }
    }
    return best ? { s: best, date: bestD } : null;
  }
  // "הלימוד שלי" = ממשיכים מהמשנה האחרונה ששמעתי: אם לא סיימתי אותה - היא;
  // אחרת - המשנה הבאה אחריה לפי הסדר שעוד לא שמעתי.
  function myNext(){
    let last = null, lastAt = 0;
    for (const path in progress){ const p = progress[path]; if (byPath[path] && (p.t > 5 || p.done) && (p.at || 0) > lastAt){ last = byPath[path]; lastAt = p.at; } }
    if (!last) return null;
    if (!isDone(last.path)) return last;
    for (let i = last.seq + 1; i < seq.length; i++) if (!isDone(seq[i].path)) return seq[i];
    return null;
  }
  function nextInSeq(s){ return seq[s.seq + 1] || null; }
  // נקודת ההמשך במסכת: המשנה האחרונה ששמעתי בה (או הבאה אחריה שלא שמעתי); אחרת - הראשונה שלא נשמעה
  function resumeIn(masechet){
    const list = inMasechet(masechet);
    let last = -1, lastAt = 0;
    list.forEach((s, i) => { const p = progress[s.path]; if (p && (p.t > 5 || p.done) && (p.at || 0) > lastAt){ last = i; lastAt = p.at; } });
    if (last >= 0) for (let i = last; i < list.length; i++) if (!isDone(list[i].path)) return list[i];
    return list.find(s => !isDone(s.path)) || null;
  }
  function heardCount(list){ return list.filter(s => isDone(s.path)).length; }

  // ====== מצב שורה/כרטיס לפי ההאזנה ======
  function fmtTime(sec){
    sec = Math.max(0, Math.floor(sec || 0));
    const h = Math.floor(sec / 3600), m = Math.floor(sec % 3600 / 60), ss = String(sec % 60).padStart(2, '0');
    return h ? `${h}:${String(m).padStart(2, '0')}:${ss}` : `${m}:${ss}`;
  }
  function mins(sec){ return Math.max(1, Math.round(sec / 60)); }
  function cardState(path){
    const p = getProg(path) || {};
    const isCur = current && current.path === path;
    const playing = isCur && !audio.paused;
    const d = p.d || 0, t = p.t || 0;
    let meta = '';
    if (playing) meta = 'מתנגן' + (d ? ` · ${mins(t)} מתוך ${mins(d)} דק'` : '');
    else if (p.done) meta = `<span class="done">✓ נשמע</span>${d ? ` · ${mins(d)} דק'` : ''}`;
    else if (t > 5 && d) meta = `נשמעו ${mins(t)} מתוך ${mins(d)} דק'`;
    else if (d) meta = `${mins(d)} דק'`;
    const pct = p.done ? 100 : (d ? Math.min(100, t / d * 100) : 0);
    return { meta, pct, done: !!p.done, saved: !!p.saved && !p.done, isCur, playing };
  }
  function refreshCards(path){
    app.querySelectorAll('[data-path]').forEach(el => {
      if (path && el.dataset.path !== path) return;
      const st = cardState(el.dataset.path);
      const meta = el.querySelector('.shiur-meta'); if (meta) meta.innerHTML = st.meta + (el.dataset.date ? (st.meta ? ' · ' : '') + el.dataset.date : '');
      const bar = el.querySelector('.shiur-bar i'); if (bar) bar.style.width = st.pct + '%';
      el.classList.toggle('is-done', st.done);
      el.classList.toggle('playing', st.isCur);
      el.classList.toggle('started', st.pct > 0);
      const sb = el.querySelector('.save-btn');
      if (sb){ sb.classList.toggle('on', st.saved); sb.innerHTML = st.saved ? ICON_BM_ON : ICON_BM; sb.title = st.saved ? 'הסר מהרשימה שלי' : 'שמור לרשימה שלי'; }
      const nb = el.querySelector('.num'); if (nb){ nb.innerHTML = st.playing ? iconPause(15) : st.done ? '✓' : nb.dataset.label; nb.setAttribute('aria-label', st.playing ? 'השהה' : 'נגן'); }
      const pb = el.querySelector('.play-btn'); if (pb){ const n = el.classList.contains('daily') ? 22 : 18; pb.innerHTML = st.playing ? iconPause(n) : iconPlay(n); pb.setAttribute('aria-label', st.playing ? 'השהה' : 'נגן'); }
    });
    const bp = document.getElementById('playBig');
    if (bp) bp.innerHTML = current && !audio.paused && bp.dataset.masechet === current.s.masechet ? iconPause(26) : iconPlay(26);
  }

  // ====== תפריט ⋮ ======
  const menuEl = document.getElementById('shiurMenu');
  let menuFor = null;
  function bottomChrome(){
    const tabsTop = document.getElementById('tabs').getBoundingClientRect().top;
    const mini = document.body.classList.contains('has-player') ? 70 : 0;
    return tabsTop > window.innerHeight / 2 ? window.innerHeight - tabsTop + mini : mini;
  }
  function openMenu(btn){
    const path = btn.closest('[data-path]').dataset.path;
    if (menuFor && menuFor.path === path){ closeMenu(); return; }
    closeMenu();
    const s = byPath[path]; if (!s) return;
    const sl = sefariaLink(s.masechet, s.perek, s.mishna);
    menuEl.innerHTML = `
      <button role="menuitem" data-act="dl">${ICON_AUDIO_DL}<span>הורד את השיעור</span></button>
      ${sl ? `<a role="menuitem" href="${sl}" target="_blank" rel="noopener">${ICON_BOOK}<span>המשנה בספריא</span></a>` : ''}
      <button role="menuitem" data-act="copy">${ICON_LINK}<span>העתק קישור למשנה</span></button>
      <button role="menuitem" data-act="heard">${ICON_CHECK}<span>${isDone(path) ? 'בטל סימון "נשמע"' : 'סמן כנשמע'}</span></button>`;
    menuFor = { path, btn };
    menuEl.hidden = false;
    btn.setAttribute('aria-expanded', 'true');
    const r = btn.getBoundingClientRect(), m = menuEl.getBoundingClientRect();
    const below = r.bottom + 6 + m.height < window.innerHeight - bottomChrome();
    menuEl.style.top = (window.scrollY + (below ? r.bottom + 6 : r.top - 6 - m.height)) + 'px';
    menuEl.style.left = Math.max(8, Math.min(r.left, window.innerWidth - m.width - 8)) + 'px';
    const first = menuEl.querySelector('a,button'); if (first) first.focus({ preventScroll:true });
  }
  function closeMenu(){ if (!menuFor) return; menuEl.hidden = true; menuFor.btn.setAttribute('aria-expanded', 'false'); menuFor = null; }
  menuEl.addEventListener('click', (e) => {
    const item = e.target.closest('a,button'); if (!item || !menuFor) return;
    const s = byPath[menuFor.path];
    if (item.dataset.act === 'dl') downloadShiur(s.url, s.filename);
    if (item.dataset.act === 'copy') copyLink(directLink(s));
    if (item.dataset.act === 'heard') toggleHeard(menuFor.path);
    closeMenu();
  });
  document.addEventListener('click', (e) => { if (menuFor && !menuEl.contains(e.target) && !e.target.closest('.more-btn')) closeMenu(); });
  document.addEventListener('keydown', (e) => { if (e.key !== 'Escape') return; if (menuFor) closeMenu(); else if (sheetOpen) history.back(); });
  window.addEventListener('scroll', closeMenu, { passive:true });
  window.addEventListener('resize', closeMenu);

  // ====== הנגן ======
  // נגן אחד לכל האתר, מחוץ לאזור שמתחלף בניווט - ממשיך להתנגן במעבר בין דפים.
  // במשניות לומדים ברצף: בסוף משנה עוברים לבאה אחריה (אפשר לכבות "ניגון רציף").
  const audio = document.getElementById('audio');
  const miniEl = document.getElementById('mini');
  const sheetEl = document.getElementById('sheet');
  const seekEl = document.getElementById('seek');
  let current = null;   // { path, s, fromList }
  let seeking = false, sheetOpen = false;

  const SPEEDS = [1, 1.25, 1.5, 1.75, 2];
  let speed = 1, autoNext = true, txtSize = 19;
  try {
    const sp = parseFloat(localStorage.getItem('mishna:speed')); if (SPEEDS.includes(sp)) speed = sp;
    autoNext = localStorage.getItem('mishna:autoNext') !== '0';
    const ts = parseInt(localStorage.getItem('mishna:textSize'), 10); if (ts >= 14 && ts <= 30) txtSize = ts;
  } catch (e) {}
  function applySpeed(){ audio.defaultPlaybackRate = speed; audio.playbackRate = speed; }
  function updateSpeedBtn(){ document.getElementById('speedVal').textContent = speed + '×'; }
  document.getElementById('speedBtn').addEventListener('click', () => {
    speed = SPEEDS[(SPEEDS.indexOf(speed) + 1) % SPEEDS.length];
    try { localStorage.setItem('mishna:speed', String(speed)); } catch (e) {}
    applySpeed(); updateSpeedBtn();
  });
  function updateAutoBtn(){
    const b = document.getElementById('autoBtn');
    b.innerHTML = ICON_LOOP + (autoNext ? 'ניגון רציף' : 'עצור בסוף');
    b.classList.toggle('on', autoNext);
    b.setAttribute('aria-label', autoNext ? 'ניגון רציף פעיל - לחצו כדי לעצור בסוף כל משנה' : 'עצירה בסוף כל משנה - לחצו לניגון רציף');
  }
  function setAutoNext(v, toast){
    autoNext = v;
    try { localStorage.setItem('mishna:autoNext', v ? '1' : '0'); } catch (e) {}
    updateAutoBtn(); updateSheet();
    if (toast) showToast(v ? 'ניגון רציף: ממשיכים למשנה הבאה' : 'עצירה בסוף כל משנה');
  }
  document.getElementById('autoBtn').addEventListener('click', () => setAutoNext(!autoNext, true));
  function applyTxtSize(){ document.getElementById('textBody').style.setProperty('--txt', txtSize + 'px'); }
  function setTxtSize(d){ txtSize = Math.max(14, Math.min(30, txtSize + d)); try { localStorage.setItem('mishna:textSize', String(txtSize)); } catch (e) {} applyTxtSize(); }
  document.getElementById('txtMinus').addEventListener('click', () => setTxtSize(-2));
  document.getElementById('txtPlus').addEventListener('click', () => setTxtSize(2));
  updateSpeedBtn(); updateAutoBtn(); applyTxtSize();
  document.getElementById('miniPlay').innerHTML = iconPlay(28);
  document.getElementById('bigPlay').innerHTML = iconPlay(32);
  document.getElementById('miniBack').innerHTML = iconBack15(26);
  document.getElementById('back15').innerHTML = iconBack15(34);
  document.getElementById('fwd15').innerHTML = iconFwd15(34);

  function playShiur(path, fromList){
    if (current && current.path === path){ audio.paused ? audio.play() : audio.pause(); return; }
    const s = byPath[path]; if (!s) return;
    if (current) rememberPosition();
    const p = getProg(path) || {};
    // ממשיכים מאיפה שעצרו - אלא אם נשמעה כבר, או שנשארו רק שניות בודדות
    const start = (!p.done && p.t > 5 && !(p.d && p.d - p.t < 10)) ? Math.floor(p.t) : 0;
    current = { path, s, fromList: fromList != null ? fromList : (!!p.saved && !p.done) };
    audio.src = s.url + (start ? '#t=' + start : '');
    applySpeed();
    document.getElementById('miniTitle').textContent = shiurTitle(s);
    miniEl.setAttribute('style', colorVars(s.seder));
    sheetEl.setAttribute('style', colorVars(s.seder));
    document.getElementById('miniCover').outerHTML = coverHtml(s.seder, '', '', 'plain', 0, 'miniCover');
    miniEl.hidden = false;
    document.body.classList.add('has-player');
    updateTimes(start, p.d || 0);
    updateSheet();
    setMediaSession();
    audio.play().catch(() => {});
    refreshCards();
  }
  function rememberPosition(){
    if (!current || !audio.duration || !isFinite(audio.duration)) return;
    const t = audio.currentTime, d = audio.duration, patch = { t, d };
    if (t / d >= DONE_RATIO) patch.done = true;
    setProg(current.path, patch);
  }
  function updateTimes(t, d){
    document.getElementById('miniTime').textContent = d ? `${fmtTime(t)} / ${fmtTime(d)}` : fmtTime(t);
    document.getElementById('curT').textContent = fmtTime(t);
    document.getElementById('remT').textContent = '-' + fmtTime(Math.max(0, d - t));
    const pct = d ? Math.min(100, t / d * 100) : 0;
    document.getElementById('miniProg').style.width = pct + '%';
    if (!seeking) seekEl.value = Math.round(pct * 10);
  }
  // מה מתנגן אחרי המשנה הזו: הבאה ברשימה (אם הופעלה משם), או הבאה לפי הסדר באותה מסכת
  function upNext(){
    if (!current) return null;
    if (current.fromList) return savedList().find(x => x.path !== current.path) || null;
    if (!autoNext) return null;
    const n = nextInSeq(current.s);
    return n && n.masechet === current.s.masechet ? n : null;
  }
  function updateSheet(){
    if (!current) return;
    const s = current.s, p = getProg(current.path) || {};
    document.getElementById('sheetSrc').textContent = current.fromList ? 'מתנגן מתוך: הרשימה שלי' : (autoNext ? 'לימוד רציף' : 'לימוד') + ' · מסכת ' + s.masechet;
    document.getElementById('sheetArt').outerHTML = masechetCover(s.masechet, '', 17, '', 'sheetArt');
    document.getElementById('sheetTitle').innerHTML = `${s.masechet} · פרק ${heb(s.perek)}<br>משנה ${s.label}`;
    document.getElementById('sheetSub').textContent = RABBI;
    const saved = !!p.saved && !p.done;
    const sv = document.getElementById('sheetSave');
    sv.innerHTML = (saved ? ICON_BM_ON : ICON_BM) + (saved ? 'שמור' : 'שמירה');
    sv.classList.toggle('on', saved);
    const sl = sefariaLink(s.masechet, s.perek, s.mishna);
    document.getElementById('textSrc').href = sl || '#';
    const body = document.getElementById('textBody');
    if (body.dataset.path !== s.path){
      body.dataset.path = s.path;
      body.className = 'text-body loading'; body.textContent = 'טוען את טקסט המשנה…';
      getPerekText(s.masechet, s.perek).then(arr => {
        if (body.dataset.path !== s.path) return;
        const t = mishnaText(arr, s);
        body.className = 'text-body';
        body.innerHTML = t ? escHtml(t) : `הטקסט לא נטען כרגע. <a href="${sl}" target="_blank" rel="noopener">לפתוח את המשנה בספריא ↗</a>`;
      });
    }
    const nx = upNext(), nb = document.getElementById('sheetNext');
    nb.hidden = !nx;
    if (nx){
      nb.dataset.path = nx.path;
      nb.innerHTML = `<span>אחרי זה: <b>${nx.masechet === s.masechet && nx.perek === s.perek ? 'משנה ' + nx.label : shortRef(nx)}</b><span id="nextSnip"></span></span>${ICON_NEXT}`;
      getPerekText(nx.masechet, nx.perek).then(arr => { const el = document.getElementById('nextSnip'); const t = mishnaText(arr, nx); if (el && t && nb.dataset.path === nx.path) el.textContent = ' · ' + snippet(t); });
    }
  }
  document.getElementById('sheetNext').addEventListener('click', () => { const nx = upNext(); if (nx){ rememberPosition(); playShiur(nx.path, current.fromList); } });

  let lastUi = 0;
  audio.addEventListener('timeupdate', () => {
    if (!current) return;
    const d = audio.duration, t = audio.currentTime;
    if (d && isFinite(d)) updateTimes(t, d);
    const now = Date.now();
    if (now - lastUi < 1000) return;
    lastUi = now;
    const wasDone = isDone(current.path);
    rememberPosition();
    refreshCards(current.path);
    if (!wasDone && isDone(current.path)){ updateBadges(); updateSheet(); }
  });
  audio.addEventListener('loadedmetadata', () => { if (!current) return; updateTimes(audio.currentTime, audio.duration); rememberPosition(); refreshCards(current.path); });
  function onPlayState(){
    document.getElementById('miniPlay').innerHTML = audio.paused ? iconPlay(28) : iconPause(28);
    document.getElementById('bigPlay').innerHTML = audio.paused ? iconPlay(32) : iconPause(32);
    if ('mediaSession' in navigator) navigator.mediaSession.playbackState = audio.paused ? 'paused' : 'playing';
    if (current){ rememberPosition(); saveProgress(); refreshCards(); }
  }
  audio.addEventListener('play', onPlayState);
  audio.addEventListener('pause', onPlayState);
  audio.addEventListener('ended', () => {
    const nx = upNext();
    if (current){ setProg(current.path, { done: true, t: audio.duration || 0 }); saveProgress(); updateBadges(); }
    onPlayState();
    if (!current) return;
    if (nx){ playShiur(nx.path, current.fromList); showToast('ממשיכים: ' + shortRef(nx)); }
    else if (current.fromList) showToast('סיימת את הרשימה');
    else if (autoNext && !nextInSeq(current.s)) showToast('הגעת לסוף השיעורים שהוקלטו');
    else if (autoNext) showToast(`הגעת לסוף השיעורים במסכת ${current.s.masechet}`);
  });
  audio.addEventListener('error', () => { if (current && audio.getAttribute('src')) showToast('לא הצלחנו לטעון את השיעור — נסו שוב'); });
  seekEl.addEventListener('input', () => { seeking = true; if (audio.duration) document.getElementById('curT').textContent = fmtTime(seekEl.value / 1000 * audio.duration); });
  seekEl.addEventListener('change', () => { seeking = false; if (audio.duration && isFinite(audio.duration)) audio.currentTime = seekEl.value / 1000 * audio.duration; });
  function skip(sec){ if (!audio.duration) return; audio.currentTime = Math.min(Math.max(0, audio.currentTime + sec), audio.duration - 0.5); }
  function togglePlay(){ if (current) audio.paused ? audio.play() : audio.pause(); }
  document.getElementById('miniBack').addEventListener('click', () => skip(-15));
  document.getElementById('back15').addEventListener('click', () => skip(-15));
  document.getElementById('fwd15').addEventListener('click', () => skip(15));
  document.getElementById('miniPlay').addEventListener('click', togglePlay);
  document.getElementById('bigPlay').addEventListener('click', togglePlay);
  document.getElementById('sheetSave').addEventListener('click', () => { if (current) toggleSaved(current.path); });

  // נגן מלא: נפתח כ"דף" בהיסטוריה, כך שכפתור "חזור" של הטלפון סוגר אותו
  function openSheet(){
    if (!current || sheetOpen) return;
    sheetOpen = true; updateSheet(); sheetEl.hidden = false; document.body.style.overflow = 'hidden';
    history.pushState({ sheet:true }, '', location.href);
    document.getElementById('bigPlay').focus({ preventScroll:true });
  }
  function hideSheet(){ sheetOpen = false; sheetEl.hidden = true; document.body.style.overflow = ''; }
  document.getElementById('miniOpen').addEventListener('click', openSheet);
  document.getElementById('sheetDown').addEventListener('click', () => history.back());
  document.getElementById('sheetClose').addEventListener('click', () => {
    rememberPosition(); saveProgress();
    audio.pause(); current = null; audio.removeAttribute('src'); audio.load();
    miniEl.hidden = true; document.body.classList.remove('has-player');
    refreshCards(); history.back();
  });
  document.getElementById('sheetTitle').addEventListener('click', () => {
    if (!current) return;
    const s = current.s;
    history.back();
    setTimeout(() => go({ type:'perek', name:s.masechet, perek:s.perek, mishna:s.mishna }), 60);
  });

  // מסך הנעילה / אוזניות / שעון
  function setMediaSession(){
    if (!('mediaSession' in navigator) || !current) return;
    try {
      navigator.mediaSession.metadata = new MediaMetadata({
        title: shiurTitle(current.s), artist: RABBI, album: 'שיעורי משנה',
        artwork: [{ src: new URL('bg-rabbi.jpg', location.href).href, sizes: '2000x1500', type: 'image/jpeg' }]
      });
      const ms = navigator.mediaSession;
      ms.setActionHandler('play', () => audio.play());
      ms.setActionHandler('pause', () => audio.pause());
      ms.setActionHandler('seekbackward', () => skip(-15));
      ms.setActionHandler('seekforward', () => skip(15));
      ms.setActionHandler('seekto', (e) => { if (e.seekTime != null) audio.currentTime = e.seekTime; });
      ms.setActionHandler('nexttrack', () => { const nx = upNext() || (current && nextInSeq(current.s)); if (nx){ rememberPosition(); playShiur(nx.path, current.fromList); } });
    } catch (e) {}
  }
  window.addEventListener('pagehide', () => { rememberPosition(); saveProgress(); });
  document.addEventListener('visibilitychange', () => { if (document.hidden){ rememberPosition(); saveProgress(); } });

  // ====== מצב יום / לילה ======
  const curTheme = () => document.documentElement.getAttribute('data-theme') === 'light' ? 'light' : 'dark';
  function themeBtnHtml(){
    const light = curTheme() === 'light';
    return `<button class="theme-btn" id="themeBtn" title="${light ? 'מעבר למצב לילה' : 'מעבר למצב יום'}" aria-label="${light ? 'מעבר למצב לילה' : 'מעבר למצב יום'}">${light ? ICON_MOON : ICON_SUN}</button>`;
  }
  function toggleTheme(){
    const next = curTheme() === 'light' ? 'dark' : 'light';
    const root = document.documentElement;
    root.classList.add('theme-anim'); root.setAttribute('data-theme', next);
    setTimeout(() => root.classList.remove('theme-anim'), 400);
    try { localStorage.setItem('mishna:theme', next); } catch (e) {}
    const m = document.querySelector('meta[name="theme-color"]'); if (m) m.setAttribute('content', next === 'light' ? '#f6efe4' : '#170f10');
    const b = document.getElementById('themeBtn'); if (b) b.outerHTML = themeBtnHtml();
    showToast(next === 'light' ? 'מצב יום' : 'מצב לילה');
  }

  // ====== לשוניות ומונים ======
  const TAB_OF = { shelf:'home', seder:'home', masechet:'home', perek:'home', error:'home', recent:'recent', search:'search', list:'list' };
  document.getElementById('tabs').addEventListener('click', (e) => {
    const tab = e.target.closest('.tab'); if (!tab) return;
    go({ type: tab.dataset.tab === 'home' ? 'shelf' : tab.dataset.tab });
  });
  function updateTabs(){
    const active = TAB_OF[view.type] || 'home';
    document.querySelectorAll('.tab').forEach(b => { const on = b.dataset.tab === active; b.classList.toggle('on', on); if (on) b.setAttribute('aria-current', 'page'); else b.removeAttribute('aria-current'); });
  }
  function recentGroups(){
    const groups = {};
    for (const path in uploadDates){ const s = byPath[path], d = (uploadDates[path] || '').slice(0, 10); if (s && parseDay(d)) (groups[d] = groups[d] || []).push(s); }
    const dates = Object.keys(groups).sort().reverse();
    if (!dates.length) return { dates: [], groups, thisWeek: false };
    const now = new Date(), today = new Date(now.getFullYear(), now.getMonth(), now.getDate());
    const weekAgo = new Date(today.getTime() - 6 * 86400000);
    const week = dates.filter(d => parseDay(d) >= weekAgo);
    return week.length ? { dates: week, groups, thisWeek: true } : { dates: [dates[0]], groups, thisWeek: false };
  }
  function newUnheard(){
    const r = recentGroups(); if (!r.thisWeek) return 0;
    return r.dates.reduce((n, d) => n + r.groups[d].filter(s => !isDone(s.path)).length, 0);
  }
  function updateBadges(){
    const setBadge = (id, n) => { const b = document.getElementById(id); b.hidden = !n; b.textContent = n || ''; };
    setBadge('badgeNew', newUnheard());
    setBadge('badgeList', savedList().length);
  }

  // ====== כתובת הדף משקפת את התצוגה ======
  // ?seder=זרעים · ?m=ברכות · ?m=ברכות&p=2 (&n=3 - הדגשת משנה) · ?new=1 · ?list=1 · ?search=1
  // קישורים ישנים בצורת ?q=ברכות+פרק+א+משנה+ב ממשיכים לעבוד (resolveQuery).
  function viewFromUrl(){
    const q = new URLSearchParams(location.search);
    if (q.has('new')) return { type:'recent' };
    if (q.has('list')) return { type:'list' };
    if (q.has('search')) return { type:'search' };
    if (q.has('q')) return resolveQuery(q.get('q')) || { type:'search', query:q.get('q') };
    const m = q.get('m');
    if (m && sederOf[m]){
      const p = parseInt(q.get('p'), 10), n = parseInt(q.get('n'), 10);
      return p ? { type:'perek', name:m, perek:p, mishna: n || null } : { type:'masechet', name:m };
    }
    const sd = q.get('seder');
    if (sd && SEDER_COLORS[sd]) return { type:'seder', name:sd };
    return { type:'shelf' };
  }
  function urlOf(v){
    const q = new URLSearchParams();
    if (v.type === 'recent') q.set('new', '1');
    if (v.type === 'list') q.set('list', '1');
    if (v.type === 'search') q.set('search', '1');
    if (v.type === 'seder') q.set('seder', v.name);
    if (v.type === 'masechet' || v.type === 'perek') q.set('m', v.name);
    if (v.type === 'perek'){ q.set('p', v.perek); if (v.mishna) q.set('n', v.mishna); }
    const s = q.toString();
    return location.pathname + (s ? '?' + s : '');
  }
  function sameView(a, b){
    return a.type === b.type && (a.name || null) === (b.name || null) && (a.perek || null) === (b.perek || null) && (a.mishna || null) === (b.mishna || null);
  }
  window.addEventListener('popstate', () => {
    if (sheetOpen){ hideSheet(); return; }
    if (view.type === 'error') return;
    view = viewFromUrl(); render(); window.scrollTo(0, 0);
  });
  function go(v){ view = v; render(); window.scrollTo({ top:0 }); }
  function backTarget(){
    if (view.type === 'perek') return { type:'masechet', name:view.name };
    if (view.type === 'masechet') return { type:'seder', name:sederOf[view.name] };
    return { type:'shelf' };
  }

  // מחיפוש/קישור ישן לתצוגה: משנה מסוימת -> הפרק עם הדגשה; פרק -> הפרק; מסכת -> המסכת
  function resolveQuery(raw){
    const parsed = parseSearchQuery(raw);
    let m = parsed.masechet;
    if (!m && parsed.masechetPartial){
      const qn = normalize(parsed.masechetPartial);
      const cands = Object.keys(index).filter(x => normalize(x).includes(qn));
      if (cands.length === 1) m = cands[0];
    }
    if (!m) return null;
    if (parsed.perek) return { type:'perek', name:m, perek:parsed.perek, mishna:parsed.mishna || null };
    return { type:'masechet', name:m };
  }

  // ====== תצוגות ======
  function render(){
    closeMenu();
    if (view.type !== 'error' && !sameView(view, viewFromUrl())) history.pushState(null, '', urlOf(view));
    if (view.type === 'error') renderError();
    else if (view.type === 'seder') renderSeder(view.name);
    else if (view.type === 'masechet') renderMasechet(view.name);
    else if (view.type === 'perek') renderPerek(view.name, view.perek);
    else if (view.type === 'recent') renderRecent();
    else if (view.type === 'list') renderList();
    else if (view.type === 'search') renderSearch();
    else renderShelf();
    updateTabs();
    app.classList.remove('fade-in'); void app.offsetWidth; app.classList.add('fade-in');
  }
  function topbar(crumb){ return `<div class="topbar"><button class="back-btn" aria-label="חזרה">${ICON_BACK}</button><span class="crumb">${crumb || ''}</span></div>`; }
  function greeting(){ const h = new Date().getHours(); return h >= 5 && h < 12 ? 'בוקר טוב' : h >= 12 && h < 17 ? 'צהריים טובים' : h >= 17 && h < 21 ? 'ערב טוב' : 'לילה טוב'; }

  // ---- בית ----
  function renderShelf(){
    let html = `<a class="all-link" href="/">${ICON_UP}כל השיעורים</a>
      <div class="home-top"><div><div class="greet">${greeting()}</div>
        <div class="greet-s">שיעורי משנה<br>${RABBI}</div></div>
        <span class="home-side">${themeBtnHtml()}<span class="avatar" aria-hidden="true"></span></span></div>
      <button class="search-fake" data-go="search">${ICON_SEARCH}חיפוש: ברכות ב ג · מסכת פאה</button>`;

    // הלימוד היומי: ממשיכים מהמקום שלי; מי שעוד לא התחיל - מצטרף למקום של השיעור
    const now = shiurNow(), mine = myNext();
    const target = mine || (now && now.s);
    // שמע הכל עד המקום של השיעור - מחכים למשנה הבאה
    const caughtUp = !mine && now && isDone(now.s.path);
    if (caughtUp){
      html += `<div class="daily" data-path="${escAttr(now.s.path)}">
        <div class="daily-tag">הלימוד היומי שלך</div>
        <div class="daily-t">✓ אתה מעודכן עם השיעור</div>
        <div class="daily-s">שמעת עד ${shortRef(now.s)}, המשנה האחרונה שעלתה (${dayLabel(now.date)}). המשנה הבאה תופיע כאן כשתעלה.</div>
      </div>`;
    } else if (target){
      const st = cardState(target.path);
      const mAll = inMasechet(target.masechet), h = heardCount(mAll);
      let sub;
      if (mine && now && mine.masechet === now.s.masechet){
        let behind = 0;
        for (let i = mine.seq; i <= now.s.seq; i++) if (!isDone(seq[i].path)) behind++;
        sub = behind === 0 ? '✓ אתה מעודכן עם השיעור' : behind === 1 ? 'זו המשנה האחרונה שעלתה' : `אתה ${behind} משניות אחרי השיעור`;
      } else if (mine) sub = st.meta ? st.meta.replace(/<[^>]+>/g, '') : 'המשנה הבאה שלך לפי הסדר';
      else sub = 'המשנה האחרונה שעלתה' + (now ? ' · ' + dayLabel(now.date) : '');
      html += `<div class="daily" data-path="${escAttr(target.path)}">
        <div class="daily-tag">${mine ? 'הלימוד היומי שלך' : 'הצטרפו לשיעור'}</div>
        <div class="daily-t">${shiurTitle(target)}</div>
        <div class="daily-s">${sub}</div>
        <div class="daily-row"><div style="flex:1;min-width:0"><div class="daily-bar"><i style="width:${mAll.length ? h / mAll.length * 100 : 0}%"></i></div>
          <div class="daily-bs">מסכת ${target.masechet} · ${h} מתוך ${nMishnayot(mAll.length)} נשמעו</div></div>
          <button class="play-btn" aria-label="${st.playing ? 'השהה' : 'נגן'}">${st.playing ? iconPause(22) : iconPlay(22)}</button></div>
      </div>`;
      if (mine && now && now.s.path !== target.path){
        html += `<button class="now-line" data-now="${escAttr(now.s.path)}"><span class="now-dot"></span>השיעור עכשיו: <b>${shortRef(now.s)}</b> · עלתה ${dayLabel(now.date)}</button>`;
      }
    }

    html += `<div id="installSlot">${installHtml()}</div>`;

    // המסכתות שלי - שיש בהן התקדמות, לפי הפעילות האחרונה
    const act = {};
    for (const path in progress){ const s = byPath[path]; if (s && (progress[path].t > 5 || progress[path].done)) act[s.masechet] = Math.max(act[s.masechet] || 0, progress[path].at || 0); }
    const myM = Object.keys(act).sort((a, b) => act[b] - act[a]);
    if (myM.length){
      html += `<div class="sec"><h3>המסכתות שלי</h3></div><div class="shelf">`;
      for (const m of myM){
        const all = inMasechet(m), h = heardCount(all), nx = resumeIn(m);
        html += `<button class="tile" data-masechet="${m}">${masechetCover(m, '', 22)}<div class="tile-t">${m}</div>
          <div class="mini-bar"><i style="width:${all.length ? h / all.length * 100 : 0}%"></i></div>
          <div class="tile-s">${h}/${all.length}${nx ? ' · פרק ' + heb(nx.perek) : ' · ✓'}</div></button>`;
      }
      html += '</div>';
    }

    const r = recentGroups();
    const items = [].concat(...r.dates.map(d => r.groups[d])).sort((a, b) => b.seq - a.seq).slice(0, 4);
    if (items.length){
      html += `<div class="sec"><h3>${r.thisWeek ? 'חדש השבוע' : 'העלאות אחרונות'}</h3><button class="link" data-go="recent">הכל</button></div>`;
      for (const s of items) html += shiurRowHtml(s, { withName:true, date: uploadDates[s.path] });
    }

    html += `<div class="sec"><h3>ששה סדרי משנה</h3><span class="link">${nShiurim(totalCount())}</span></div><div class="arch">`;
    for (const sd of SEDARIM){
      const n = sd.masechtot.reduce((a, m) => a + inMasechet(m).length, 0);
      html += `<button class="vol${n ? '' : ' empty'}" data-seder="${sd.name}">${coverHtml(sd.name, '', '', 'plain')}
        <span><div class="vol-n">סדר ${sd.name}</div><div class="vol-c">${n ? nShiurim(n) : 'טרם הוקלט'}</div></span></button>`;
    }
    html += '</div>';
    if (unmatched.length){
      html += `<details class="unmatched"><summary>קבצים שלא זוהו (${unmatched.length})</summary><ul>${unmatched.map(u => `<li>${escHtml(u)}</li>`).join('')}</ul>
        <p>בדקו ששם הקובץ בנוי כך: מסכת_פרק_א_משנה_ב.m4a (שם המסכת חייב להתאים לשמות שבארון)</p></details>`;
    }
    html += `<p class="dedic">נבנה באהבה עבור אאמו"ר הרה"ג רבי יצחק ולדומירסקי</p>`;
    app.innerHTML = html;
  }

  // ---- סדר ----
  function renderSeder(name){
    const sd = SEDARIM.find(x => x.name === name);
    const total = sd.masechtot.reduce((a, m) => a + inMasechet(m).length, 0);
    let html = `<div class="page" style="${colorVars(name)}"><div class="tint"></div><div style="position:relative">${topbar('ששה סדרי משנה')}
      <div class="hdr">${coverHtml(name, name, 'סדר', '', 30)}<div><div class="hdr-t">סדר ${name}</div><div class="hdr-s">${sd.masechtot.length} מסכתות · ${total ? nShiurim(total) : 'טרם הוקלט'}</div></div></div>
      <div class="plist" style="margin-top:14px">`;
    for (const m of sd.masechtot){
      const all = inMasechet(m), h = heardCount(all);
      html += `<button class="prow${all.length ? '' : ' empty'}" data-masechet="${m}">${masechetCover(m, 'sm', 15, '')}
        <span class="prow-gr"><div class="prow-n">מסכת ${m}</div><div class="prow-s">${all.length ? `${nShiurim(all.length)}${h ? ` · נשמעו ${h}` : ''}` : 'טרם הוקלט'}</div></span>
        ${all.length ? `<span class="prow-c">${ICON_CHEV}</span>` : ''}</button>`;
    }
    app.innerHTML = html + '</div></div></div>';
  }

  // ---- מסכת: פרקים עם טבעות התקדמות ----
  function ringSvg(heard, rec){
    const C = 113.1;
    if (!rec) return `<svg class="ring" viewBox="0 0 44 44"><circle class="trk" cx="22" cy="22" r="18" fill="none" stroke-width="4" stroke-dasharray="3 4"/></svg>`;
    if (heard >= rec) return `<svg class="ring" viewBox="0 0 44 44"><circle class="ok" cx="22" cy="22" r="18" fill="none" stroke-width="4"/><text x="22" y="27" text-anchor="middle" font-size="15" style="fill:var(--done)">✓</text></svg>`;
    return `<svg class="ring" viewBox="0 0 44 44"><circle class="trk" cx="22" cy="22" r="18" fill="none" stroke-width="4"/>${heard ? `<circle class="val" cx="22" cy="22" r="18" fill="none" stroke-width="4" stroke-linecap="round" stroke-dasharray="${(heard / rec * C).toFixed(1)} ${C}" transform="rotate(-90 22 22)"/>` : ''}<text x="22" y="26.5" text-anchor="middle" font-size="12" font-weight="700">${heard}/${rec}</text></svg>`;
  }
  function renderMasechet(name){
    const sd = sederOf[name];
    const all = inMasechet(name), h = heardCount(all);
    const perakim = index[name] || {};
    const total = PEREK_COUNTS[name] || 0;
    const nums = []; for (let i = 1; i <= total; i++) nums.push(i);
    for (const p of Object.keys(perakim).map(Number)) if (!nums.includes(p)) nums.push(p);
    nums.sort((a, b) => a - b);
    const nx = resumeIn(name);
    let html = `<div class="page" style="${colorVars(sd)}"><div class="tint"></div><div style="position:relative">${topbar('סדר ' + sd)}
      <div class="hdr">${masechetCover(name, '', 28)}<div><div class="hdr-t">מסכת ${name}</div><div class="hdr-s">סדר ${sd} · ${total} פרקים · ${all.length ? nShiurim(all.length) : 'טרם הוקלט'}</div></div></div>`;
    if (all.length){
      html += `<div class="prog-row"><span class="bar"><i style="width:${h / all.length * 100}%"></i></span><span>${h} מתוך ${all.length} נשמעו</span></div>
        <div class="ctl"><div class="ctl-l">
          <a class="icon-btn" href="${sefariaLink(name)}" target="_blank" rel="noopener" title="המסכת בספריא" aria-label="המסכת בספריא">${ICON_BOOK}</a>
          <button class="icon-btn" data-share="${escAttr(location.origin + location.pathname + '?m=' + encodeURIComponent(name))}" title="העתק קישור" aria-label="העתק קישור למסכת">${ICON_SHARE}</button></div>
          <div class="ctl-r">${nx ? `<div class="next-l">${h ? 'המשך:' : 'התחלה:'}<br><b>פרק ${heb(nx.perek)} משנה ${nx.label}</b></div>` : `<div class="next-l">✓ שמעת את כל<br>השיעורים במסכת</div>`}
          <button class="big-play" id="playBig" data-masechet="${name}" aria-label="המשך לימוד במסכת">${iconPlay(26)}</button></div></div>`;
    }
    if (!nums.length) html += `<div class="empty-box">עדיין לא הוקלטו שיעורים במסכת זו</div>`;
    html += '<div class="pgrid">';
    for (const p of nums){
      const rows = perakim[p] || [], hp = heardCount(rows);
      const cur = nx && nx.perek === p;
      html += `<button class="pk${rows.length ? '' : ' off'}${cur ? ' cur' : ''}" data-perek="${p}">${ringSvg(hp, rows.length)}
        <span class="pk-n">פרק ${heb(p)}</span><span class="pk-c">${!rows.length ? 'טרם הוקלט' : hp >= rows.length ? 'סיימת' : cur ? 'לומדים עכשיו' : nMishnayot(rows.length)}</span></button>`;
    }
    app.innerHTML = html + '</div></div></div>';
    if (current) refreshCards();
  }

  // ---- פרק: שורה לכל משנה, עם תחילת הטקסט ----
  function renderPerek(name, perek){
    const sd = sederOf[name];
    const rows = (index[name] && index[name][perek]) || [];
    const h = heardCount(rows);
    let html = `<div class="page" style="${colorVars(sd)}">${topbar(`סדר ${sd} · מסכת ${name}`)}
      <h2 class="ptitle">${name} · פרק ${heb(perek)}</h2>
      <p class="psub">${rows.length ? `${nMishnayot(rows.length)}${h ? ` · נשמעו ${h}` : ''}` : 'טרם הוקלט'}</p>
      <div class="acts-row">${rows.length ? `<button class="pill-btn" id="playPerek">${iconPlay(15)} נגן את כל הפרק</button>` : ''}
        ${sefariaLink(name, perek) ? `<a class="pill-out" href="${sefariaLink(name, perek)}" target="_blank" rel="noopener">${ICON_BOOK} הפרק בספריא</a>` : ''}</div>`;
    if (!rows.length) html += `<div class="empty-box">עדיין לא הוקלטו שיעורים בפרק זה.</div>`;
    let marked = false;
    for (const s of rows){
      const hl = !!view.mishna && (s.mishna === view.mishna || (s.extra || []).includes(view.mishna));
      html += shiurRowHtml(s, { hl, target: hl && !marked, date: s.date ? 'הוקלט ב-' + formatDate(s.date) : (uploadDates[s.path] ? 'עלתה ' + dayLabel(uploadDates[s.path]) : '') });
      if (hl) marked = true;
    }
    app.innerHTML = html + '</div>';
    const target = document.getElementById('target-mishna');
    if (target) setTimeout(() => target.scrollIntoView({ behavior:'smooth', block:'center' }), 100);
    // תחילת הטקסט של כל משנה (נטען מספריא, נשמר במכשיר)
    getPerekText(name, perek).then(arr => {
      if (!arr || view.type !== 'perek' || view.name !== name || view.perek !== perek) return;
      app.querySelectorAll('.snip[data-p]').forEach(el => { el.textContent = snippet(mishnaText(arr, byPath[el.dataset.p])); });
    });
  }

  // שורת משנה. withName - בדפים שמערבבים מסכתות (חדש, הרשימה): עטיפה ומראה מקום מלא
  function shiurRowHtml(s, o){
    o = o || {};
    const st = cardState(s.path);
    const dateTxt = o.date && o.withName ? 'עלתה ' + dayLabel(o.date) : (o.date || '');
    const lead = o.withName ? masechetCover(s.masechet, 'sm', 14, '') : `<button class="num" data-label="${s.label}" aria-label="${st.playing ? 'השהה' : 'נגן'}">${st.playing ? iconPause(15) : st.done ? '✓' : s.label}</button>`;
    return `<div class="shiur-row${o.hl ? ' hl' : ''}${st.done ? ' is-done' : ''}${st.isCur ? ' playing' : ''}${st.pct > 0 ? ' started' : ''}" data-path="${escAttr(s.path)}"${dateTxt ? ` data-date="${escAttr(dateTxt)}"` : ''}${o.target ? ' id="target-mishna"' : ''}>
        ${lead}
        <div class="shiur-gr">
          <div class="shiur-title">${o.withName ? shiurTitle(s) : 'משנה ' + s.label}</div>
          ${o.withName ? '' : `<div class="snip" data-p="${escAttr(s.path)}"></div>`}
          <div class="shiur-sub"><span class="shiur-meta">${st.meta}${dateTxt ? (st.meta ? ' · ' : '') + dateTxt : ''}</span></div>
          <div class="shiur-bar"><i style="width:${st.pct}%"></i></div>
        </div>
        <div class="shiur-acts">
          <button class="icon-btn save-btn${st.saved ? ' on' : ''}" title="${st.saved ? 'הסר מהרשימה שלי' : 'שמור לרשימה שלי'}" aria-label="שמירה לרשימה שלי">${st.saved ? ICON_BM_ON : ICON_BM}</button>
          <button class="icon-btn more-btn" title="אפשרויות נוספות" aria-label="אפשרויות נוספות" aria-haspopup="menu">${ICON_MORE}</button>
        </div>
        ${o.withName ? `<button class="play-btn" aria-label="${st.playing ? 'השהה' : 'נגן'}">${st.playing ? iconPause(18) : iconPlay(18)}</button>` : ''}
      </div>`;
  }

  // ---- חדש ----
  function renderRecent(){
    const r = recentGroups();
    let html = `<div class="page-top"><h2 class="ptitle">${r.thisWeek || !r.dates.length ? 'חדש השבוע' : 'העלאות אחרונות'}</h2>
      <p class="psub">${r.thisWeek ? 'משניות שעלו לאתר בשבוע האחרון' : (r.dates.length ? 'השבוע לא עלו שיעורים חדשים - זו ההעלאה האחרונה' : '')}</p></div>`;
    if (!r.dates.length) html += `<div class="empty-box">אין עדיין מידע על העלאות</div>`;
    for (const d of r.dates){
      html += `<div class="sub-h">${parseDay(d).toLocaleDateString('he-IL', { weekday:'long', day:'numeric', month:'long' })}</div>`;
      for (const s of r.groups[d].slice().sort((a, b) => a.seq - b.seq)) html += shiurRowHtml(s, { withName:true });
    }
    app.innerHTML = html;
  }

  // ---- הרשימה שלי ----
  function renderList(){
    const saved = savedList(), cont = continueList(), heard = heardList();
    let html = `<div class="page-top"><h2 class="ptitle">הרשימה שלי</h2><p class="psub">נשמר במכשיר הזה בלבד</p></div>`;
    if (!saved.length && !cont.length && !heard.length) html += `<div class="empty-box">הרשימה ריקה.<br>לחצו על סימן השמירה ${ICON_BM} ליד משנה כדי להוסיף אותה לכאן.</div>`;
    if (saved.length){
      html += `<div class="list-head"><span class="sub-h">שמורים להמשך</span><button class="pill-btn" id="playListBtn">${iconPlay(15)} נגן את הרשימה</button></div>`;
      for (const s of saved) html += shiurRowHtml(s, { withName:true });
    }
    if (cont.length){ html += `<div class="sub-h">התחלתי ולא סיימתי</div>`; for (const s of cont) html += shiurRowHtml(s, { withName:true }); }
    if (heard.length){ html += `<div class="sub-h">נשמעו לאחרונה</div>`; for (const s of heard) html += shiurRowHtml(s, { withName:true }); }
    app.innerHTML = html;
  }

  // ---- חיפוש ----
  let lastQuery = '';
  function renderSearch(){
    if (view.query != null){ lastQuery = view.query; view.query = null; }
    app.innerHTML = `<div class="page-top"><h2 class="ptitle">חיפוש</h2></div>
      <div class="search-box">${ICON_SEARCH}<input type="search" class="search-input" id="searchInput" placeholder="מסכת, פרק ומשנה" autocomplete="off" enterkeyhint="search"></div>
      <p class="search-hint">למשל: ברכות ב ג · שביעית פרק ה · מסכת פאה</p>
      <div id="searchResults"></div>`;
    const input = document.getElementById('searchInput');
    input.value = lastQuery;
    input.addEventListener('input', () => { lastQuery = input.value; searchResults(); });
    input.addEventListener('keydown', (e) => {
      if (e.key !== 'Enter') return;
      e.preventDefault();
      const v = resolveQuery(lastQuery);
      if (v) go(v); else { const first = document.querySelector('#searchResults .prow'); if (first) first.click(); }
    });
    searchResults();
    setTimeout(() => input.focus(), 50);
  }
  function searchResults(){
    const box = document.getElementById('searchResults');
    const q = lastQuery.trim();
    const withContent = Object.keys(index).sort((a, b) => masechetOrder[a] - masechetOrder[b]);
    const mRow = m => { const all = inMasechet(m), h = heardCount(all); return `<button class="prow" data-masechet="${m}">${masechetCover(m, 'sm', 15, '')}
      <span class="prow-gr"><div class="prow-n">מסכת ${m}</div><div class="prow-s">סדר ${sederOf[m]} · ${nShiurim(all.length)}${h ? ` · נשמעו ${h}` : ''}</div></span><span class="prow-c">${ICON_CHEV}</span></button>`; };
    if (!q){ box.innerHTML = `<div class="plist">${withContent.map(mRow).join('')}</div>`; return; }
    const parsed = parseSearchQuery(q);
    let m = parsed.masechet && index[parsed.masechet] ? parsed.masechet : null;
    let cands = [];
    if (!m && parsed.masechetPartial){
      const qn = normalize(parsed.masechetPartial);
      cands = withContent.filter(x => normalize(x).includes(qn));
      if (cands.length === 1) m = cands[0];
    }
    if (m){
      let html = `<div class="plist">${mRow(m)}</div>`;
      if (parsed.perek){
        const rows = ((index[m] || {})[parsed.perek] || []).filter(s => !parsed.mishna || s.mishna === parsed.mishna || (s.extra || []).includes(parsed.mishna));
        html += `<div class="sub-h">פרק ${heb(parsed.perek)}${parsed.mishna ? ' · משנה ' + heb(parsed.mishna) : ''}</div>`;
        html += rows.length ? rows.map(s => shiurRowHtml(s, {})).join('') : `<div class="empty-box">${parsed.mishna ? 'המשנה הזו' : 'הפרק הזה'} עוד לא הוקלט</div>`;
      }
      box.innerHTML = html;
      if (parsed.perek) getPerekText(m, parsed.perek).then(arr => { if (!arr) return; box.querySelectorAll('.snip[data-p]').forEach(el => { el.textContent = snippet(mishnaText(arr, byPath[el.dataset.p])); }); });
      return;
    }
    if (cands.length > 1){ box.innerHTML = `<div class="plist">${cands.map(mRow).join('')}</div>`; return; }
    const known = parsed.masechet;
    box.innerHTML = `<div class="empty-box">${known ? `מסכת ${known} עוד לא הוקלטה` : `לא נמצאה מסכת בשם "${escHtml(parsed.masechetPartial || q)}"`}</div>`;
  }

  function renderError(){
    app.innerHTML = `<div class="page-top"><h2 class="ptitle">שגיאה</h2></div><div class="empty-box">שגיאה בטעינת רשימת השיעורים.<br>בדקו את החיבור לאינטרנט ונסו לרענן.</div>`;
  }

  // ====== לחיצות (האצלת אירוע אחת לכל הדפים) ======
  app.addEventListener('click', (e) => {
    const t = e.target;
    if (t.closest('#themeBtn')){ toggleTheme(); return; }
    if (t.closest('#installGo')){ doInstall(); return; }
    if (t.closest('#installX')){ dismissInstall(); return; }
    if (t.closest('#playBig')){
      const m = view.name;
      if (current && current.s.masechet === m) togglePlay();
      else { const nx = resumeIn(m) || inMasechet(m)[0]; if (nx) playShiur(nx.path, false); }
      return;
    }
    const play = t.closest('.play-btn, .num');
    if (play){ playShiur(play.closest('[data-path]').dataset.path); return; }
    const save = t.closest('.save-btn'); if (save){ toggleSaved(save.closest('[data-path]').dataset.path); return; }
    const more = t.closest('.more-btn'); if (more){ openMenu(more); return; }
    if (t.closest('.back-btn')){ go(backTarget()); return; }
    const sh = t.closest('[data-share]'); if (sh){ copyLink(sh.dataset.share); return; }
    if (t.closest('#playPerek')){
      const rows = (index[view.name] || {})[view.perek] || [];
      const nx = rows.find(s => !isDone(s.path)) || rows[0];
      if (nx){ if (!autoNext) setAutoNext(true, false); playShiur(nx.path, false); }
      return;
    }
    if (t.closest('#playListBtn')){
      const l = savedList(); if (!l.length) return;
      if (current && current.path === l[0].path){ current.fromList = true; if (audio.paused) audio.play(); updateSheet(); }
      else playShiur(l[0].path, true);
      return;
    }
    const nl = t.closest('.now-line'); if (nl){ const s = byPath[nl.dataset.now]; if (s) go({ type:'perek', name:s.masechet, perek:s.perek, mishna:s.mishna }); return; }
    const daily = t.closest('.daily'); if (daily){ playShiur(daily.dataset.path); return; }
    const g = t.closest('[data-go]'); if (g){ go({ type:g.dataset.go }); return; }
    const vol = t.closest('[data-seder]'); if (vol){ go({ type:'seder', name:vol.dataset.seder }); return; }
    const mas = t.closest('[data-masechet]'); if (mas){ go({ type:'masechet', name:mas.dataset.masechet }); return; }
    const pk = t.closest('.pk'); if (pk){ go({ type:'perek', name:view.name, perek:+pk.dataset.perek }); return; }
    // לחיצה על שורת משנה (לא על כפתור/קישור) - מנגנת
    const row = t.closest('.shiur-row'); if (row && !t.closest('a,button')){ playShiur(row.dataset.path); return; }
  });

  // ====== האפליקציה המאוחדת ======
  // אפליקציה אחת לכל השיעורים ("שיעורי הרב"), שנפתחת בדף השער. כשפתוחים
  // כאפליקציה מסמנים את החלון - כדי שאתר הפרשות יידע שהוא בתוכה ולא באפליקציית
  // הפרשות הישנה. ?app=1 מגיע מקיצורי הדרך של האייקון - מסירים אותו מהכתובת.
  const isStandalone = () => matchMedia('(display-mode: standalone)').matches || navigator.standalone === true;
  if (isStandalone()){
    try { sessionStorage.setItem('shiurim:app', '1'); localStorage.setItem('shiurim:unified', '1'); } catch (e) {}
  }
  if (new URLSearchParams(location.search).has('app')){
    const u = new URL(location.href); u.searchParams.delete('app');
    history.replaceState(null, '', u.pathname + u.search);
  }

  // התקנה: אנדרואיד/מחשב (כרום) - כפתור (beforeinstallprompt); אייפון - הסבר קצר.
  // לא מוצג כשכבר פתוחים כאפליקציה, או אחרי שסגרו את ההצעה (כאן או בדף השער).
  let installEvt = null;
  const INSTALL_KEY = 'shiurim:installDismissed';
  const isIOS = /iphone|ipad|ipod/i.test(navigator.userAgent) || (navigator.platform === 'MacIntel' && navigator.maxTouchPoints > 1);
  function installDismissed(){ try { return !!localStorage.getItem(INSTALL_KEY); } catch (e) { return false; } }
  function installHtml(){
    if (isStandalone() || installDismissed() || !(installEvt || isIOS)) return '';
    const sub = installEvt ? 'משניות ופרשות במקום אחד, ממסך הבית' : 'בספארי: כפתור השיתוף ⎋ ואז "הוסף למסך הבית"';
    return `<div class="install"><img src="/icons/icon-192.png" alt="">
      <div class="install-gr"><div class="install-t">התקינו את האפליקציה</div><div class="install-s">${sub}</div></div>
      ${installEvt ? '<button class="install-go" id="installGo">התקנה</button>' : ''}
      <button class="install-x" id="installX" aria-label="סגור">${ICON_CLOSE}</button></div>`;
  }
  function refreshInstall(){ const slot = document.getElementById('installSlot'); if (slot) slot.innerHTML = installHtml(); }
  window.addEventListener('beforeinstallprompt', (e) => { e.preventDefault(); installEvt = e; refreshInstall(); });
  window.addEventListener('appinstalled', () => { installEvt = null; refreshInstall(); showToast('האפליקציה הותקנה'); });
  function doInstall(){
    if (!installEvt) return;
    installEvt.prompt();
    installEvt.userChoice.finally(() => { installEvt = null; refreshInstall(); });
  }
  function dismissInstall(){ try { localStorage.setItem(INSTALL_KEY, '1'); } catch (e) {} refreshInstall(); }
  if ('serviceWorker' in navigator) navigator.serviceWorker.register('/sw.js', { scope:'/' }).catch(() => {});

  // ====== טעינה ======
  const LIST_CACHE = 'mishna:listCache';
  function fetchJSON(url, ms){
    const ctrl = ('AbortController' in window) ? new AbortController() : null;
    const t = setTimeout(() => ctrl && ctrl.abort(), ms || 8000);
    return fetch(url, Object.assign({ cache:'no-store' }, ctrl ? { signal:ctrl.signal } : {}))
      .then(r => { if (!r.ok) throw new Error('http ' + r.status); return r.json(); }).finally(() => clearTimeout(t));
  }
  function load(){
    const uploadsReq = fetchJSON('uploads.json?t=' + Date.now()).catch(() => ({}));
    return Promise.all([fetchJSON('list.json?t=' + Date.now()).then(list => {
        try { localStorage.setItem(LIST_CACHE, JSON.stringify(list)); } catch (e) {}
        return list;
      }).catch(() => {
        // אין רשת - מציגים את הרשימה השמורה מהביקור הקודם
        try { const c = JSON.parse(localStorage.getItem(LIST_CACHE)); if (Array.isArray(c)) return c; } catch (e) {}
        throw new Error('no list');
      }), uploadsReq])
      .then(([list, uploads]) => {
        buildIndex(Array.isArray(list) ? list : []);
        uploadDates = uploads || {};
        updateBadges();
        view = viewFromUrl();
        // קישור ישן (?q=...) - מחליפים לכתובת החדשה בלי להוסיף להיסטוריה
        if (new URLSearchParams(location.search).has('q') && view.type !== 'search') history.replaceState(null, '', urlOf(view));
        render();
      })
      .catch(() => { view = { type:'error' }; render(); });
  }

  // ====== הורדת שיעור ======
  // קישור רגיל לקובץ בענן (כתובת של אתר אחר) לא באמת מוריד: הדפדפן פותח נגן,
  // ובאייפון - במיוחד באפליקציה המותקנת - זה נתקע. לכן האתר מוריד את הקובץ
  // בעצמו (דורש הרשאת CORS בדלי ה-R2), ואז: באייפון - חלון השיתוף עם "שמירה
  // בקבצים" (הוא דורש לחיצה, לכן כפתור "שמירה" כשההורדה מוכנה); בשאר -
  // הורדה רגילה לתיקיית ההורדות. אם ההורדה נכשלת - כפתור שפותח את הקובץ כמו פעם.
  const dlBar = document.getElementById('dlBar'), dlMsg = document.getElementById('dlMsg'), dlAct = document.getElementById('dlAct');
  let dlBusy = false, dlAction = null, dlHideTimer;
  function showDl(msg, actLabel, action, autoHide){
    clearTimeout(dlHideTimer);
    dlMsg.textContent = msg;
    dlAction = action || null;
    dlAct.hidden = !actLabel; dlAct.textContent = actLabel || '';
    dlBar.hidden = false;
    if (autoHide) dlHideTimer = setTimeout(hideDl, autoHide);
  }
  function hideDl(){ dlBar.hidden = true; dlAction = null; }
  dlAct.addEventListener('click', () => { const a = dlAction; hideDl(); if (a) a(); });
  document.getElementById('dlX').addEventListener('click', hideDl);
  const iosDevice = /iphone|ipad|ipod/i.test(navigator.userAgent) || (navigator.platform === 'MacIntel' && navigator.maxTouchPoints > 1);
  async function downloadShiur(url, filename){
    if (dlBusy) return;
    dlBusy = true;
    showDl('מוריד את השיעור…');
    try {
      // no-store: שלא יוחזר עותק מהמטמון של הנגן (בלי כותרות ה-CORS)
      const r = await fetch(url, { mode:'cors', cache:'no-store' });
      if (!r.ok) throw new Error('http ' + r.status);
      const total = +r.headers.get('content-length') || 0;
      let blob;
      if (r.body && r.body.getReader && total){
        const reader = r.body.getReader(), parts = [];
        let got = 0, shown = -1;
        for (;;){
          const { done, value } = await reader.read();
          if (done) break;
          parts.push(value); got += value.length;
          const pct = Math.floor(got / total * 100);
          if (pct !== shown){ shown = pct; dlMsg.textContent = `מוריד את השיעור… ${pct}%`; }
        }
        blob = new Blob(parts, { type: r.headers.get('content-type') || 'audio/mp4' });
      } else blob = await r.blob();
      const file = new File([blob], filename, { type: blob.type || 'audio/mp4' });
      if (iosDevice && navigator.canShare && navigator.canShare({ files:[file] })){
        showDl('השיעור מוכן', 'שמירה', () => navigator.share({ files:[file] }).catch(() => {}));
      } else {
        const u = URL.createObjectURL(file), a = document.createElement('a');
        a.href = u; a.download = filename; document.body.appendChild(a); a.click();
        setTimeout(() => { a.remove(); URL.revokeObjectURL(u); }, 60000);
        showDl('השיעור ירד לתיקיית ההורדות', '', null, 3500);
      }
    } catch (e) {
      showDl('ההורדה לא הצליחה', 'פתח את הקובץ', () => window.open(url, '_blank', 'noopener'));
    } finally { dlBusy = false; }
  }

  let toastTimer;
  function showToast(msg){
    const t = document.getElementById('toast');
    t.textContent = msg; t.classList.add('show');
    clearTimeout(toastTimer); toastTimer = setTimeout(() => t.classList.remove('show'), 3000);
  }

  // ספארי באייפון מתעלם מ-user-scalable=no, אז חוסמים את מחוות הצביטה ישירות
  ['gesturestart', 'gesturechange'].forEach(ev => document.addEventListener(ev, e => e.preventDefault(), { passive:false }));

  load();
})();
</script>
